      if (bad(s.z)) return;
      if (!ep) {
        if (s.eligible && Math.abs(s.z) >= c.entry_z) ep = { k0: k, k1: k, start: s.date, end: null, side: Math.sign(s.z), peak: s.z, status: "open" };
        return;
      }
      ep.k1 = k;
      if (Math.sign(s.z) === ep.side && Math.abs(s.z) > Math.abs(ep.peak)) ep.peak = s.z;
      if (ep.side * s.z <= c.exit_z) { ep.end = s.date; ep.status = "closed"; out.push(ep); ep = null; }
      else if (Math.abs(s.z) >= c.stop_z) { ep.end = s.date; ep.status = "broke"; out.push(ep); ep = null; }
    });
    if (ep) out.push(ep);
    return out.reverse();
  }
  function analyze() {
    const md = S.md, n = md.dates.length, la = E.logs(md.closes[S.pair[0]]), lb = E.logs(md.closes[S.pair[1]]);
    const days = PERIODS.find(p => p[0] === S.period)[1];
    const start = Math.max(S.cfg.signal.lookback, n - days);
    const sigs = [];
    for (let t = start; t < n; t++) sigs.push(E.computeSignal(la, lb, t, S.cfg.signal, md.dates[t]));
    const prec = E.precedent(md, S.pair, S.cfg); // past drifts on this pair shape the expiry, as in the cloud watcher
    S.an = { start, sigs, drifts: findDrifts(sigs), prec, scan: E.paperScan(S.ledger, md, S.pair, E.precedentConfig(S.cfg, prec)), record: undefined, outcomes: {} };
  }
  function record() { // the rules' walk-forward record on this pair (after costs), computed once per analysis
    if (S.an.record !== undefined) return S.an.record;
    try { S.an.record = E.walkForward(S.md, S.pair, S.cfg); } catch { S.an.record = null; }
    return S.an.record;
  }
  function outcome(ep) { // what the rules would have done with this drift
    if (S.an.outcomes[ep.start]) return S.an.outcomes[ep.start];
    const i = S.md.dates.indexOf(ep.start), sim = new E.Simulator(S.md, S.pair, S.cfg);
    sim.run(i, Math.min(S.md.dates.length, i + 70), S.cfg.signal.entry_z);
    const tr = sim.trades[0];
    let o;
    if (tr) o = { pnl: tr.pnl, cost: tr.entry_cost, days: tr.days_held, reason: tr.exit_reason, legs: tr.legs };
    else if (sim.position) o = { open: true, pnl: sim.position.mark - sim.position.entryCost, cost: sim.position.entryCost, legs: sim.position.proposal.legs.map(l => `${l.contracts}x ${E.qKey(l.quote)}`).join(", ") };
    else o = { skipped: sim.rejections[0] ? sim.rejections[0].reasons[0] : "No trade" };
    return (S.an.outcomes[ep.start] = o);
  }

  // ------------------------------------------------------------ actions
  function useDemo() {
    S.source = "demo"; S.pair = ["SYNA", "SYNB"]; S.error = null;
    S.full = E.makeSynthetic({ rate: S.cfg.data.risk_free_rate });
    setAsOf(latest());
  }
  async function loadPair(a, b, refresh = false) {
    a = a.trim().toUpperCase(); b = b.trim().toUpperCase();
    if (!/^[A-Z.\-]{1,10}$/.test(a) || !/^[A-Z.\-]{1,10}$/.test(b) || a === b) { S.error = { msg: "Enter two different tickers, like KO and PEP." }; render(); return; }
    S.pick = [a, b]; S.busy = "load"; S.error = null; savePrefs(); render();
    try {
      const ca = await getSeries(a, refresh), cb = await getSeries(b, refresh);
      S.full = buildReal(a, b, ca, cb); S.source = "real"; S.pair = [a, b]; S.open = null;
      setAsOf(latest()); savePrefs();
    } catch (e) {
      S.error = { msg: e.message, kind: e.kind };
    } finally { S.busy = null; render(); }
  }
  function trackTrade() {
    const r = S.an.scan.result;
    try {
      const rec = E.paperConfirm(S.ledger, r.id, S.md, S.cfg);
      saveLedger(); analyze(); S.sheet = null; S.view = "positions";
      toast(`Tracking ${S.pair.join(" / ")} · ${money(rec.max_loss)} committed`);
    } catch (e) { S.sheet = null; toast(e.message); }
  }
  function closeTrade(id) {
    try {
      const c = E.paperClose(S.ledger, id, S.md, S.cfg);
      saveLedger(); analyze(); S.sheet = null;
      toast(`Closed · ${money(c.pnl, true)}`);
    } catch (e) { S.sheet = null; toast(e.message); }
  }
  let toastTimer;
  function toast(msg) { S.toast = msg; render(); clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; render(); }, 3500); }

  // ------------------------------------------------------------ charts
  function chart({ lines, labels, shades = [], refs = [], h = 220, fmt = v => v.toFixed(0), sel = null }) {
    const W = 720, H = h, pl = 6, pr = 52, pt = 10, pb = 24, n = labels.length;
    const all = lines.flatMap(l => l.vals.filter(v => !bad(v))).concat(refs.map(r => r[0]));
    if (!all.length) return "";
    let lo = Math.min(...all), hi = Math.max(...all);
    if (hi === lo) { hi += 1; lo -= 1; }
    const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
    const X = i => pl + (W - pl - pr) * i / Math.max(n - 1, 1), Y = v => pt + (H - pt - pb) * (1 - (v - lo) / (hi - lo));
    let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
    for (const [k0, k1, key] of shades) s += `<rect class="shade${key === sel ? " sel" : ""}" x="${X(k0).toFixed(1)}" y="${pt}" width="${Math.max(X(k1) - X(k0), 3).toFixed(1)}" height="${H - pt - pb}" rx="3"/>`;
    for (const [v, cls] of refs) s += `<line class="${cls}" x1="${pl}" x2="${W - pr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/>`;
    for (const l of lines) {
      let d = "", pen = false;
      l.vals.forEach((v, i) => { if (bad(v)) { pen = false; return; } d += `${pen ? "L" : "M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`; pen = true; });
      s += `<path class="${l.cls}" d="${d}"/>`;
      const li = l.vals.length - 1;
      if (!bad(l.vals[li])) s += `<circle class="dot" cx="${X(li).toFixed(1)}" cy="${Y(l.vals[li]).toFixed(1)}" r="4"/><text x="${W - pr + 8}" y="${(Y(l.vals[li]) + 4).toFixed(1)}">${esc(l.tag || "")}</text>`;
    }
    for (const [v] of refs.filter(r => r[2])) s += `<text x="${W - pr + 8}" y="${(Y(v) + 4).toFixed(1)}">${esc(fmt(v))}</text>`;
    s += `<text x="${pl}" y="${H - 4}">${esc(dMon(labels[0]))}</text><text x="${W - pr}" y="${H - 4}" text-anchor="end">${esc(dMon(labels[n - 1]))}</text>`;
    return s + "</svg>";
  }
  function spark(vals, up) {
    const W = 300, H = 56, n = vals.length;
    if (n < 2) return "";
    let lo = Math.min(...vals), hi = Math.max(...vals); if (hi === lo) { hi += 1; lo -= 1; }
    const X = i => W * i / (n - 1), Y = v => 4 + (H - 8) * (1 - (v - lo) / (hi - lo));
    const d = vals.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join("");
    const col = up ? "var(--up)" : "var(--down)";
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path class="a" d="${d}L${W},${H}L0,${H}Z" fill="${col}"/><path class="l" d="${d}" stroke="${col}"/></svg>`;
  }

  // ------------------------------------------------------------ views
  const legName = l => `Buy ${l.contracts} ${l.symbol} ${l.right === "C" ? "call" : "put"}${l.contracts > 1 ? "s" : ""}`;
  const tag = r => `<span class="tag ${r === "C" ? "call" : "put"}">${r === "C" ? "CALL" : "PUT"}</span>`;

  function viewPicker() {
    const isPreset = p => S.source === "real" && S.pair[0] === p[0] && S.pair[1] === p[1];
    return `<section class="card">
      <div class="chips" role="group" aria-label="Pair">
        ${PRESETS.map(p => `<button class="chip" data-act="preset" data-a="${p[0]}" data-b="${p[1]}" aria-pressed="${isPreset(p)}">${p[0]} · ${p[1]}</button>`).join("")}
        <button class="chip" data-act="demo" aria-pressed="${S.source === "demo"}">Demo</button>
      </div>
      <div class="pickers">
        <input class="input" id="tk-a" value="${esc(S.pick[0])}" aria-label="First ticker" autocomplete="off" spellcheck="false">
        <span>/</span>
        <input class="input" id="tk-b" value="${esc(S.pick[1])}" aria-label="Second ticker" autocomplete="off" spellcheck="false">
      </div>
      <div class="head" style="align-items:center">
        <div class="seg" role="group" aria-label="Period">${PERIODS.map(([p]) => `<button data-act="period" data-p="${p}" aria-pressed="${S.period === p}">${p}</button>`).join("")}</div>
        <button class="btn primary" data-act="analyze">${S.busy === "load" ? '<span class="spin"></span>' : ""}Analyze</button>
      </div>
      ${S.error ? `<div class="note warn">${esc(S.error.msg)}</div>
        ${S.error.kind === "key" && !inClaude ? `<div class="field"><input class="input plain" id="td-key" type="password" placeholder="Twelve Data API key" autocomplete="off">
          <small>Free at twelvedata.com. Stored only in this browser.</small><div><button class="btn sm primary" data-act="save-key">Save key</button></div></div>` : ""}` : ""}
    </section>`;
  }

  function viewAnalyze() {
    const an = S.an, sigs = an.sigs, cur = sigs[sigs.length - 1], [a, b] = S.pair, c = S.cfg.signal;
    const live = an.drifts.find(e => e.status === "open");
    const pill = bad(cur.z) ? `<span class="pill">No signal</span>`
      : live ? `<span class="pill drift">Drifting · ${esc(cur.z > 0 ? a : b)} rich</span>`
      : !cur.eligible && Math.abs(cur.z) >= c.entry_z ? `<span class="pill down">Unstable pair</span>`
      : `<span class="pill">Near parity</span>`;
    const md = S.md, labels = md.dates.slice(an.start);
    const pa = Array.from(md.closes[a].slice(an.start)), pb = Array.from(md.closes[b].slice(an.start));
    const base = (arr) => { const f = arr.find(v => !bad(v)); return arr.map(v => bad(v) ? NaN : v / f * 100); };
    const shades = an.drifts.map(e => [e.k0, e.k1, e.start]);
    const ch = S.chart === "prices"
      ? chart({ lines: [{ vals: base(pb), cls: "ln-b", tag: b }, { vals: base(pa), cls: "ln-a", tag: a }], labels, shades, sel: S.open })
      : chart({ lines: [{ vals: sigs.map(s => s.z), cls: "ln-z", tag: zf(cur.z) }], labels, shades, sel: S.open, h: 200, fmt: zf,
          refs: [[c.entry_z, "band", 1], [-c.entry_z, "band", 1], [0, "zero"]] });
    const dataLine = S.source === "demo" ? "Demo data (made up)" : `Twelve Data · daily close ${dShort(latest())}`;

    return `
      ${replaying() ? `<div class="replay"><span class="grow">Replay · ${dLong(S.asOf)}</span>
        <button data-act="day" data-k="-1" aria-label="Previous day">‹</button><button data-act="day" data-k="1" aria-label="Next day">›</button><button data-act="today">Today</button></div>` : ""}
      ${viewPicker()}
      <section class="card">
        <div class="head"><div><div class="pair-name">${esc(a)} / ${esc(b)}</div><div class="small muted">${esc(dataLine)}${S.source === "real" ? ` · <button class="link" data-act="refresh">Refresh</button>` : ""}</div></div>${pill}</div>
        <div class="stats">
          <div class="stat"><span class="label">Drift now</span><span class="big ${live ? "drift" : ""}">${zf(cur.z)}</span></div>
          <div class="stat"><span class="label">Trade signal at</span><span class="v">±${c.entry_z.toFixed(1)}</span></div>
          <div class="stat"><span class="label">Drifts in ${esc(S.period)}</span><span class="v">${an.drifts.length}</span></div>
        </div>
        <div class="seg" role="group" aria-label="Chart">
          <button data-act="chart" data-c="prices" aria-pressed="${S.chart === "prices"}">Prices</button>
          <button data-act="chart" data-c="drift" aria-pressed="${S.chart === "drift"}">Drift</button>
        </div>
        ${ch}
        <div class="legend">${S.chart === "prices" ? `<span><i style="background:var(--line-a)"></i>${esc(a)}</span><span><i style="background:var(--line-b)"></i>${esc(b)}</span>` : `<span><i style="background:var(--drift)"></i>Signal ±${c.entry_z}</span>`}
          <span><i style="background:var(--drift-soft);height:10px"></i>Drift periods</span></div>
      </section>
      ${viewTrade()}
      ${viewDrifts()}
      ${viewRecord()}
      <p class="foot">Paper trading only · not financial advice · option prices are modeled</p>`;
  }

  function viewTrade() {
    const r = S.an.scan.result, c = S.cfg.signal;
    if (r.type !== "proposal") {
      const open = r.stage === "risk" && /already have a paper trade/.test(r.reasons[0]);
      const z = S.an.scan.signal.z;
      const msg = open ? "You're already tracking this pair."
        : r.stage === "signal" && !bad(z) && Math.abs(z) < c.entry_z ? `Drift is ${zf(z)}. A trade triggers at ±${c.entry_z.toFixed(1)}.`
        : r.reasons[0];
      return `<section class="card"><div class="head"><h3 class="mid">No trade now</h3>
        ${open ? `<button class="btn sm" data-act="view" data-v="positions">View position</button>` : ""}</div>
        <p class="note">${esc(msg)}</p></section>`;
    }
    const conv = r.scenarios.find(s => s.name.startsWith("The gap closes completely") || s.name.startsWith("Spread fully"));
    const flat = r.scenarios.find(s => s.name.startsWith("Nothing moves"));
    const exp = r.legs[0].quote.expiry;
    return `<section class="card">
      <div class="head"><h3 class="mid">Suggested trade</h3><span class="small muted">${dLong(r.quote_date)}</span></div>
      ${r.legs.map(l => `<div class="leg">${tag(l.right)}<div><div class="t">${legName(l)}</div><div class="s">$${l.quote.strike} strike · expires ${dShort(l.quote.expiry)} · ${cents(l.entry_price)} each</div></div>
        <div class="r">${money(l.entry_price * 100 * l.contracts)}</div></div>`).join("")}
      <div class="divider"></div>
      <div class="stats">
        <div class="stat"><span class="label">Max loss</span><span class="v">${money(r.max_loss)}</span></div>
        <div class="stat"><span class="label">If gap closes · 2 wks</span><span class="v ${conv.pnl >= 0 ? "up" : "down"}">${money(conv.pnl, true)}</span></div>
        <div class="stat"><span class="label">If nothing moves</span><span class="v ${flat.pnl >= 0 ? "up" : "down"}">${money(flat.pnl, true)}</span></div>
      </div>
      ${precLine()}
      ${conv.pnl < 0 ? `<p class="note warn">Time decay and costs outweigh the expected gain. Consider skipping.</p>` : ""}
      <p class="note">Closes when drift returns inside ±${c.exit_z}, after ${c.max_hold_days} trading days, or a week before ${dShort(exp)}.</p>
      <button class="btn primary block" data-act="ask-track">Track this trade</button>
    </section>`;
  }

  function precLine() {
    const p = S.an.prec;
    if (!p.n) return `<p class="note">No earlier drifts on this pair to learn from.</p>`;
    const days = p.median_days == null ? "" : `, typically in ${plural(Math.round(p.median_days), "trading day")}`;
    const won = p.trades.length ? ` Rules' trades won ${p.wins} of ${p.trades.length}.` : "";
    return `<p class="note${p.thin ? " warn" : ""}"><b>Precedent:</b> ${p.closed} of ${p.n} past drifts closed${days}.${won}${p.thin ? " Few cases, so treat with caution." : ""}</p>`;
  }

  function viewDrifts() {
    const ds = S.an.drifts, [a, b] = S.pair;
    if (!ds.length) return `<section class="card"><h3 class="mid">Drift periods</h3><p class="note">No significant drift in this period.</p></section>`;
    const rows = ds.map(e => {
      const rich = e.side > 0 ? a : b, days = e.k1 - e.k0, isOpen = S.open === e.start;
      const when = e.end ? `${dShort(e.start)} – ${dShort(e.end)}` : `Since ${dShort(e.start)}`;
      const status = e.status === "open" ? "Ongoing" : e.status === "broke" ? "Broke apart" : `Closed in ${plural(days, "day")}`;
      let detail = "";
      if (isOpen) {
        const o = outcome(e);
        detail = `<div class="detail">${o.skipped ? `<p class="note">Rules skipped it: ${esc(o.skipped)}</p>` : `
          <p class="small muted">${esc(o.legs)}</p>
          <div class="stats"><div class="stat"><span class="label">Rules' result</span><span class="v ${o.pnl >= 0 ? "up" : "down"}">${money(o.pnl, true)}</span></div>
          <div class="stat"><span class="label">Paid</span><span class="v">${money(o.cost)}</span></div>
          <div class="stat"><span class="label">${o.open ? "Status" : "Held"}</span><span class="v">${o.open ? "Open" : plural(o.days, "day")}</span></div></div>`}
          ${e.start < S.asOf ? `<div><button class="btn sm" data-act="replay" data-d="${e.start}">Replay from ${dShort(e.start)}</button></div>` : ""}</div>`;
      }
      return `<button class="item" data-act="drift" data-d="${e.start}" aria-expanded="${isOpen}">
          <span><span class="t">${when}</span><span class="s">${esc(rich)} rich · peak ${zf(e.peak)} · ${status}</span></span><span class="r faint">${isOpen ? "–" : "+"}</span>
        </button>${detail}`;
    }).join("");
    return `<section class="card"><h3 class="mid">Drift periods</h3><div class="list">${rows}</div></section>`;
  }

  function viewRecord() {
    if (!S.recordShown) return `<section class="card"><div class="head" style="align-items:center"><div><h3 class="mid">Rules' track record</h3>
      <p class="note">How these rules did on this pair in past years, after costs.</p></div><button class="btn sm" data-act="record">Run test</button></div></section>`;
    const bt = record();
    if (!bt) return `<section class="card"><h3 class="mid">Rules' track record</h3><p class="note">Not enough history for a fair test.</p></section>`;
    const m = bt.metrics, ci = m.mean_trade_ci90, luck = !ci || (ci[0] <= 0 && 0 <= ci[1]);
    return `<section class="card"><h3 class="mid">Rules' track record</h3>
      <div class="stats">
        <div class="stat"><span class="label">Return after costs</span><span class="v ${m.total_return >= 0 ? "up" : "down"}">${pct(m.total_return, 1, true)}</span></div>
        <div class="stat"><span class="label">Trades · won</span><span class="v">${m.trades} · ${pct(m.win_rate, 0)}</span></div>
        <div class="stat"><span class="label">Worst drop</span><span class="v down">${pct(-m.max_drawdown, 1)}</span></div>
      </div>
      <p class="note ${luck ? "warn" : ""}">${luck ? "Too few or too mixed results to rule out luck." : "Tested only on unseen periods. Past results don't predict future ones."}</p></section>`;
  }

  function posHistory(rec) { // value of the position for each day from entry to the as-of date
    const ds = S.md.dates.filter(d => d >= rec.quote_date), vals = [];
    for (const d of ds) {
      const qs = rec.legs.map(l => S.md.options.quote(l.symbol, d, l.expiry, l.strike, l.right));
      if (qs.every(Boolean)) vals.push(qs.reduce((s, q, k) => s + (q.bid || 0) * 100 * rec.legs[k].contracts, 0));
    }
    return vals;
  }

  function viewPositions() {
    const st = E.ledgerState(S.ledger, S.md, S.cfg), marks = E.ledgerMarks(S.ledger, S.md, S.cfg);
    const gain = st.equity - S.ledger.starting_equity;
    const cards = marks.map(mk => {
      const r = mk.record, [a, b] = r.pair;
      if (mk.blocked) return `<section class="card"><div class="pair-name">${esc(a)} / ${esc(b)}</div><p class="note">${esc(mk.blocked)}</p>
        ${S.source === "real" || a === "SYNA" ? "" : `<button class="btn sm" data-act="preset" data-a="${a}" data-b="${b}">Load ${esc(a)} / ${esc(b)}</button>`}</section>`;
      const pnl = mk.unrealized, closeNow = mk.exits.length > 0;
      const zNow = mk.z, prog = bad(zNow) ? 0 : Math.max(0, Math.min(1, 1 - Math.abs(zNow) / Math.abs(r.signal_z)));
      const hist = posHistory(r);
      return `<section class="card">
        <div class="head"><div><div class="pair-name">${esc(a)} / ${esc(b)}</div><div class="small muted">Opened ${dShort(r.quote_date)} · day ${mk.held} of ${S.cfg.signal.max_hold_days}</div></div>
          ${closeNow ? `<span class="pill up">Close now</span>` : `<span class="pill">Hold</span>`}</div>
        <div><div class="big ${pnl >= 0 ? "up" : "down"}">${money(pnl, true)}</div><div class="small muted">${pct(pnl / r.max_loss, 1, true)} · paid ${money(r.max_loss)} · worth ${money(mk.value)}</div></div>
        ${spark(hist, pnl >= 0)}
        <div class="field"><div class="head small"><span class="label">Gap closed</span><span class="num">${pct(prog, 0)} · drift ${zf(zNow)} → target ±${S.cfg.signal.exit_z}</span></div><div class="prog"><i style="width:${(prog * 100).toFixed(0)}%"></i></div></div>
        ${r.legs.map(l => `<div class="leg">${tag(l.right)}<div><div class="t">${legName(l)}</div><div class="s">$${l.strike} strike · expires ${dShort(l.expiry)}</div></div><div class="r">${cents(l.entry_price)}</div></div>`).join("")}
        ${closeNow ? `<p class="note">${esc(mk.exits.map(x => x.replace(/\s*\(z [^)]*\)/, "").replace(/:.*$/, "")).join(" · "))}</p>` : ""}
        <button class="btn ${closeNow ? "primary" : ""} block" data-act="ask-close" data-id="${esc(r.id)}">Close position</button>
      </section>`;
    }).join("");
    const closed = [...S.ledger.closed].reverse().slice(0, 12);
    return `
      ${replaying() ? `<div class="replay"><span class="grow">Replay · ${dLong(S.asOf)}</span>
        <button data-act="day" data-k="-1" aria-label="Previous day">‹</button><button data-act="day" data-k="1" aria-label="Next day">›</button>
        ${marks.length ? `<button data-act="skip">Skip to close signal</button>` : `<button data-act="today">Today</button>`}</div>` : ""}
      <section class="card"><span class="label">Paper account</span><div class="big">${money(st.equity)}</div>
        <div class="small ${gain >= 0 ? "up" : "down"}">${money(gain, true)} all time <span class="muted">· ${money(st.premium_at_risk)} at risk</span></div></section>
      ${cards || `<section class="card empty"><h3 class="mid">Nothing tracked yet</h3><p class="note">Analyze a pair and track a suggested trade.</p>
        <button class="btn primary" data-act="view" data-v="analyze">Analyze a pair</button></section>`}
      ${closed.length ? `<section class="card"><h3 class="mid">Closed</h3><div class="list">${closed.map(c => `<div class="item" style="cursor:default">
        <div><div class="t">${esc(c.pair.join(" / "))}</div><div class="s">${dShort(c.quote_date)} – ${dShort(c.closed_quote_date)} · paid ${money(c.max_loss)}</div></div>
        <div class="r ${c.pnl >= 0 ? "up" : "down"}">${money(c.pnl, true)}</div></div>`).join("")}</div></section>` : ""}
      <p class="foot">Paper trading only · positions valued at the bid${S.source === "real" ? ` · <button class="link" data-act="refresh">Refresh prices</button>` : ""}</p>`;
  }

  // ------------------------------------------------------------ watcher screen
  function miniZ(series, entry) { // today's drift path for one pair, with the alert lines
    const W = 320, H = 90, pt = 6, pb = 16, n = series.length;
    if (n < 2) return `<p class="note">Today's drift path appears after a few checks.</p>`;
    const vals = series.map(s => s[1]), lim = Math.max(entry + 0.5, ...vals.map(Math.abs));
    const X = i => W * i / (n - 1), Y = v => pt + (H - pt - pb) * (1 - (v + lim) / (2 * lim));
    const d = vals.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join("");
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Drift today">
      <line class="band" x1="0" x2="${W}" y1="${Y(entry)}" y2="${Y(entry)}"/><line class="band" x1="0" x2="${W}" y1="${Y(-entry)}" y2="${Y(-entry)}"/>
      <line class="zero" x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}"/><path class="ln-z" d="${d}"/>
      <circle class="dot" cx="${X(n - 1)}" cy="${Y(vals[n - 1])}" r="4"/>
      <text x="0" y="${H - 2}">${esc(series[0][0])}</text><text x="${W}" y="${H - 2}" text-anchor="end">${esc(series[n - 1][0])} ET</text></svg>`;
  }
  function runsTimeline(runs, alerts) { // each check as a dot across the 9:30-16:00 session
    const W = 640, H = 34, toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
    const x = t => 8 + (W - 16) * Math.min(1, Math.max(0, (toMin(t) - 570) / 390));
    const alertTimes = new Set(alerts.map(a => new Date(a.t).toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit", hourCycle: "h23", timeZone: "America/New_York" })));
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Checks today">
      <line class="zero" x1="8" x2="${W - 8}" y1="12" y2="12"/>
      ${runs.map(t => `<circle cx="${x(t).toFixed(1)}" cy="12" r="${alertTimes.has(t) ? 6 : 3.5}" fill="${alertTimes.has(t) ? "var(--drift)" : "var(--line-a)"}"/>`).join("")}
      <text x="8" y="32">9:30</text><text x="${W / 2}" y="32" text-anchor="middle">12:45</text><text x="${W - 8}" y="32" text-anchor="end">16:00 ET</text></svg>`;
  }
  function viewWatcher() {
    if (inClaude) return `<section class="card empty"><h3 class="mid">Watcher</h3>
      <p class="note">claude.ai doesn't let pages read outside services, so the live watcher view runs at your Pairs Lab web address.</p>
      <a class="btn primary" href="${PAGES_URL}" target="_blank" rel="noopener">Open ${esc(PAGES_URL.replace("https://", ""))}</a></section>`;
    if (!local.get("ntfytopic")) return `<section class="card"><h3 class="mid">Connect the watcher</h3>
      <p class="note">Paste your alert topic (the pairslab-… name you subscribed to in ntfy). It stays in this browser.</p>
      <input class="input plain" id="ntfy-topic" placeholder="pairslab-…" autocomplete="off" spellcheck="false">
      <button class="btn primary" data-act="save-topic">Connect</button></section>`;
    const w = S.watch, st = w.status;
    if (!st) return `<section class="card empty"><h3 class="mid">Watcher</h3><p class="note">${esc(w.error || "Loading status…")}</p>
      <button class="btn" data-act="watch-refresh">${w.loading ? '<span class="spin"></span>' : ""}Refresh</button></section>`;
    const last = st.last || st.at, minsSince = (Date.now() - new Date(last).getTime()) / 60000;
    const state = !st.open ? ["Market closed", ""] : minsSince > 25 ? ["Delayed", "drift"] : ["Live", "up"];
    const next = st.open ? new Date(new Date(last).getTime() + st.every * 60000) : null;
    const pairs = st.pairs.map(p => {
      const tracking = st.tracking && st.tracking[p.p];
      const pill = p.n === "ALERT" || tracking ? `<span class="pill drift">Drifting</span>` : p.n.includes("unstable") ? `<span class="pill down">Unstable</span>` : `<span class="pill">Near parity</span>`;
      const [a, b] = p.p.split("/");
      return `<section class="card">
        <div class="head"><div class="pair-name">${esc(p.p.replace("/", " / "))}</div>${pill}</div>
        <div class="stats"><div class="stat"><span class="label">Drift now</span><span class="big ${tracking ? "drift" : ""}">${zf(p.z)}</span></div>
          <div class="stat"><span class="label">Alert at</span><span class="v">±${st.entry}</span></div></div>
        ${miniZ(p.s || [], st.entry)}
        <button class="btn sm" data-act="preset" data-a="${esc(a)}" data-b="${esc(b)}">Analyze ${esc(p.p.replace("/", " / "))}</button></section>`;
    }).join("");
    return `
      <section class="card">
        <div class="head"><div><span class="label">Cloud watcher</span><div class="big">${state[0]}</div></div><span class="pill ${state[1]}">${state[0] === "Live" ? "Checking every 10 min" : state[0]}</span></div>
        <div class="stats">
          <div class="stat"><span class="label">Last check</span><span class="v">${esc(ago(last))}</span></div>
          <div class="stat"><span class="label">Next check</span><span class="v">${next ? esc(next > new Date() ? `~${Math.max(1, Math.round((next - Date.now()) / 60000))} min` : "any moment") : "At the open"}</span></div>
          <div class="stat"><span class="label">Checks today</span><span class="v">${st.runs.length}</span></div>
        </div>
        ${st.runs.length ? runsTimeline(st.runs, st.alerts) : ""}
        <p class="note">Status from ${esc(ago(st.at))} · refreshes every minute · <button class="link" data-act="watch-refresh">Refresh now</button></p>
      </section>
      ${pairs || `<section class="card"><p class="note">No pairs checked yet.</p></section>`}
      <section class="card"><h3 class="mid">Alerts sent</h3>
        ${st.alerts.length ? `<div class="list">${st.alerts.map(al => `<div class="item" style="cursor:default">
          <span><span class="t">${esc(al.title)}</span><span class="s" style="white-space:pre-line">${esc(al.msg)}</span></span>
          <span class="r faint small">${esc(ago(al.t))}</span></div>`).join("")}</div>` : `<p class="note">None yet. You'll get a phone alert when a pair drifts past ±${st.entry}.</p>`}
      </section>
      <p class="foot">Runs on GitHub every 10 minutes while the market is open · alerts via ntfy · decision support only</p>`;
  }

  // ------------------------------------------------------------ sheets
  function sheetView() {
    if (!S.sheet) return "";
    let body = "";
    if (S.sheet === "track") {
      const r = S.an.scan.result;
      body = `<h2>Track this trade?</h2>
        ${r.legs.map(l => `<div class="leg">${tag(l.right)}<div><div class="t">${legName(l)}</div><div class="s">$${l.quote.strike} strike · ${dShort(l.quote.expiry)}</div></div><div class="r">${money(l.entry_price * 100 * l.contracts)}</div></div>`).join("")}
        <div class="divider"></div>
        <div class="head"><span class="muted">Paper money committed</span><span class="mid">${money(r.max_loss)}</span></div>
        <p class="note">Simulated at the asking price. That's also the most this trade can lose.</p>
        <button class="btn primary block" data-act="track">Confirm</button><button class="btn block" data-act="sheet-close">Cancel</button>`;
    } else if (S.sheet.startsWith("close:")) {
      const id = S.sheet.slice(6), rec = S.ledger.positions.find(p => p.id === id);
      let est = null;
      if (rec) {
        const qs = rec.legs.map(l => S.md.options.quote(l.symbol, S.asOf, l.expiry, l.strike, l.right));
        if (qs.every(Boolean)) est = qs.reduce((s, q, k) => s + (E.sellPrice(q, S.cfg.costs) || 0) * 100 * rec.legs[k].contracts, 0) - E.fees(rec.legs.reduce((s, l) => s + l.contracts, 0), S.cfg.costs);
      }
      body = `<h2>Close ${esc(rec ? rec.pair.join(" / ") : "")}?</h2>
        <div class="stats"><div class="stat"><span class="label">You receive</span><span class="v">${money(est)}</span></div>
        <div class="stat"><span class="label">Result</span><span class="v ${est - (rec ? rec.max_loss : 0) >= 0 ? "up" : "down"}">${est == null ? "–" : money(est - rec.max_loss, true)}</span></div></div>
        <p class="note">Sells both options at the bid, after fees.</p>
        <button class="btn primary block" data-act="close" data-id="${esc(id)}">Close position</button><button class="btn block" data-act="sheet-close">Keep open</button>`;
    } else if (S.sheet === "settings") {
      const f = (sec, key, label, scale, step) => `<div class="field"><label class="label" for="s-${key}">${label}</label>
        <input class="input plain" id="s-${key}" type="number" step="${step}" data-sec="${sec}" data-key="${key}" data-scale="${scale}" value="${+(S.cfg[sec][key] * scale).toFixed(4)}"></div>`;
      body = `<h2>Settings</h2>
        ${f("risk", "starting_equity", "Paper account size ($)", 1, 1000)}
        ${f("risk", "max_loss_per_trade_pct", "Max loss per trade (% of account)", 100, 0.5)}
        ${f("signal", "entry_z", "Trade when drift reaches", 1, 0.1)}
        ${f("signal", "exit_z", "Close when drift is back within", 1, 0.1)}
        ${f("signal", "max_hold_days", "Max days in a trade", 1, 1)}
        ${inClaude ? `<p class="note">Real prices come from your Twelve Data connector.</p>` : `<div class="field"><label class="label" for="td-key">Twelve Data key</label>
          <input class="input plain" id="td-key" type="password" placeholder="${local.get("tdkey") ? "Saved · paste to replace" : "Paste your free key"}" autocomplete="off"></div>
          <div class="field"><label class="label" for="ntfy-topic-set">Watcher alert topic</label>
          <input class="input plain" id="ntfy-topic-set" type="password" placeholder="${local.get("ntfytopic") ? "Saved · paste to replace" : "pairslab-…"}" autocomplete="off"></div>`}
        <button class="btn primary block" data-act="save-settings">Save</button>
        <div class="row-btns"><button class="btn sm" data-act="defaults">Restore defaults</button><button class="btn sm" data-act="reset">Reset paper account</button></div>`;
    } else if (S.sheet === "info") {
      body = `<h2>How it works</h2><ul>
        <li>Two companies that usually move together, like Coke and Pepsi, sometimes drift apart.</li>
        <li><b>Drift</b> measures how unusual the gap is. ±1 is normal; at ±${S.cfg.signal.entry_z} the app suggests a trade.</li>
        <li>The trade buys <b>puts</b> on the expensive stock and <b>calls</b> on the cheap one. It profits if the gap closes; the most you can lose is what you paid.</li>
        <li>Positions tells you to hold or close, based on fixed rules.</li>
        <li>Paper money only. Stock prices are real (Twelve Data); option prices are modeled. Not financial advice.</li></ul>
        <button class="btn primary block" data-act="sheet-close">Got it</button>`;
    } else if (S.sheet === "reset") {
      body = `<h2>Reset paper account?</h2><p class="note">Erases all tracked and closed trades and restarts with ${money(S.cfg.risk.starting_equity)}.</p>
        <button class="btn primary block" data-act="reset-yes">Reset</button><button class="btn block" data-act="sheet-close">Cancel</button>`;
    }
    return `<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">${body}</div></div>`;
  }

  // ------------------------------------------------------------ render
  function render() {
    const y = window.scrollY, focusId = document.activeElement && document.activeElement.id;
    const n = S.ledger.positions.length;
    app.innerHTML = `
      <header class="top"><div class="top-in">
        <span class="brand">Pairs Lab</span>
        <div class="seg" role="group" aria-label="Screen">
          <button data-act="view" data-v="analyze" aria-pressed="${S.view === "analyze"}">Analyze</button>
          <button data-act="view" data-v="positions" aria-pressed="${S.view === "positions"}">Positions${n ? `<span class="badge">${n}</span>` : ""}</button>
          <button data-act="view" data-v="watcher" aria-pressed="${S.view === "watcher"}">Watcher</button>
        </div>
        <button class="icon-btn" data-act="sheet" data-s="info" aria-label="How it works">${ICON.info}</button>
        <button class="icon-btn" data-act="sheet" data-s="settings" aria-label="Settings">${ICON.gear}</button>
      </div></header>
      <main>${S.view === "analyze" ? viewAnalyze() : S.view === "positions" ? viewPositions() : viewWatcher()}</main>
      ${sheetView()}
      ${S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : ""}`;
    window.scrollTo(0, y);
    if (focusId) { const el = document.getElementById(focusId); if (el) el.focus({ preventScroll: true }); }
  }

  // ------------------------------------------------------------ events
  app.addEventListener("click", ev => {
    const el = ev.target.closest("[data-act]");
    if (!el || el.disabled) return;
    const act = el.dataset.act;
    if (act === "scrim" && ev.target !== el) return; // clicks inside the sheet
    switch (act) {
      case "view":
        S.view = el.dataset.v; window.scrollTo(0, 0);
        if (S.view === "watcher" && !inClaude && Date.now() - S.watch.fetchedAt > 30000) { render(); fetchStatus(); return; }
        break;
      case "watch-refresh": fetchStatus(); return;
      case "save-topic": {
        const v = ((document.getElementById("ntfy-topic") || {}).value || "").trim();
        if (!/^[\w-]{6,64}$/.test(v)) { toast("That doesn't look like a topic name"); return; }
        local.set("ntfytopic", v.replace(/-status$/, "")); fetchStatus(); return;
      }
      case "preset": S.pick = [el.dataset.a, el.dataset.b]; S.view = "analyze"; loadPair(el.dataset.a, el.dataset.b); return;
      case "demo": useDemo(); savePrefs(); break;
      case "analyze": loadPair(document.getElementById("tk-a").value, document.getElementById("tk-b").value); return;
      case "refresh": loadPair(S.pair[0], S.pair[1], true); return;
      case "period": S.period = el.dataset.p; savePrefs(); S.open = null; analyze(); break;
      case "chart": S.chart = el.dataset.c; break;
      case "drift": S.open = S.open === el.dataset.d ? null : el.dataset.d; break;
      case "replay": S.open = null; setAsOf(el.dataset.d); window.scrollTo(0, 0); toast(`Replaying from ${dLong(S.asOf)}`); return;
      case "day": stepDay(Number(el.dataset.k)); break;
      case "today": setAsOf(latest()); break;
      case "skip": {
        for (let k = 0; k < 60 && replaying(); k++) {
          if (E.ledgerMarks(S.ledger, S.md, S.cfg).some(m => m.exits.length)) break;
          stepDay(1);
        }
        break;
      }
      case "record": S.recordShown = true; break;
      case "ask-track": S.sheet = "track"; break;
      case "track": trackTrade(); return;
      case "ask-close": S.sheet = "close:" + el.dataset.id; break;
      case "close": closeTrade(el.dataset.id); return;
      case "sheet": S.sheet = el.dataset.s; break;
      case "sheet-close": case "scrim": S.sheet = null; break;
      case "save-key": {
        const v = (document.getElementById("td-key") || {}).value || "";
        if (!v.trim()) return;
        local.set("tdkey", v.trim()); S.error = null; loadPair(S.pick[0], S.pick[1]); return;
      }
      case "save-settings": {
        const cfg = JSON.parse(JSON.stringify(S.cfg));
        for (const inp of app.querySelectorAll(".sheet input[data-key]")) {
          const v = Number(inp.value);
          if (Number.isFinite(v) && v > 0) cfg[inp.dataset.sec][inp.dataset.key] = v / Number(inp.dataset.scale);
        }
        const key = (document.getElementById("td-key") || {}).value || "";
        if (key.trim()) local.set("tdkey", key.trim());
        const topic = ((document.getElementById("ntfy-topic-set") || {}).value || "").trim();
        if (/^[\w-]{6,64}$/.test(topic)) { local.set("ntfytopic", topic.replace(/-status$/, "")); S.watch.fetchedAt = 0; }
        S.cfg = cfg; Store.save("settings", cfg); S.sheet = null; S.recordShown = false; analyze(); toast("Saved"); return;
      }
      case "defaults": S.cfg = E.defaultConfig(); Store.save("settings", S.cfg); S.sheet = null; analyze(); toast("Defaults restored"); return;
      case "reset": S.sheet = "reset"; break;
      case "reset-yes": S.ledger = E.newLedger(S.cfg); saveLedger(); analyze(); S.sheet = null; toast("Paper account reset"); return;
      default: return;
    }
    render();
  });
  app.addEventListener("keydown", ev => {
    if (ev.key === "Enter" && (ev.target.id === "tk-a" || ev.target.id === "tk-b")) loadPair(document.getElementById("tk-a").value, document.getElementById("tk-b").value);
    if (ev.key === "Escape" && S.sheet) { S.sheet = null; render(); }
  });

  // ------------------------------------------------------------ boot: cached real pair if there is one, else demo
  function boot() {
    const link = /^#([A-Za-z.]{1,10})-([A-Za-z.]{1,10})$/.exec(location.hash); // opened from a drift alert
    if (link) { S.pick = [link[1].toUpperCase(), link[2].toUpperCase()]; prefs.source = "real"; }
    const ca = prefs.source === "real" && local.get("td." + S.pick[0]), cb = prefs.source === "real" && local.get("td." + S.pick[1]);
    if (link && !(ca && cb)) S.error = { msg: `Alert for ${S.pick[0]} / ${S.pick[1]}. Tap Analyze to load it.` };
    if (ca && cb) {
      try { S.full = buildReal(S.pick[0], S.pick[1], ca, cb); S.source = "real"; S.pair = [...S.pick]; setAsOf(latest()); return; } catch { /* fall back */ }
    }
    useDemo();
  }
  boot();
  if (/^#watcher$/.test(location.hash)) S.view = "watcher";
  render();
  if (S.view === "watcher") fetchStatus();
  setInterval(() => { if (S.view === "watcher" && !inClaude && !S.sheet && document.visibilityState === "visible") fetchStatus(); }, 60000);
  (async () => {
    await Store.init();
    const [savedCfg, savedLedger] = await Promise.all([Store.load("settings"), Store.load("ledger")]);
    if (savedCfg && savedCfg.signal && savedCfg.risk) {
      const base = E.defaultConfig();
      for (const k of Object.keys(base)) if (base[k] && typeof base[k] === "object" && !Array.isArray(base[k])) base[k] = { ...base[k], ...(savedCfg[k] || {}) };
      S.cfg = base;
    }
    if (savedLedger && Array.isArray(savedLedger.positions)) S.ledger = { ...savedLedger, pending: {} };
    analyze(); render();
  })();
})();
</script>
</body></html>
