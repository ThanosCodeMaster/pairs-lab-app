  // ------------------------------------------------------------ Twelve Data (history + today's 1-minute bars)
  class DataError extends Error { constructor(msg, kind = "other") { super(msg); this.kind = kind; } }
  function parseBars(payload) { // -> [[datetime, close], ...] oldest first; works for REST JSON and the connector's text
    if (payload && typeof payload === "object" && !Array.isArray(payload) && typeof payload.result === "string") payload = payload.result;
    let rows = [];
    if (typeof payload === "string") {
      const t = payload.trim();
      if (/^error\b/i.test(t)) {
        const msg = t.replace(/^error:?\s*/i, "").replace(/\*\*/g, "");
        throw new DataError(/symbol|figi/i.test(msg) ? "Ticker not found. Use US symbols like KO or PEP." : /credit|limit/i.test(msg) ? "Twelve Data limit reached." : msg, /symbol/i.test(msg) ? "symbol" : /credit|limit/i.test(msg) ? "limit" : "other");
      }
      if (/^datetime[;,]/i.test(t)) {
        const lines = t.split(/\r?\n/), head = lines[0].split(/[;,]/).map(h => h.trim().toLowerCase());
        const iD = head.indexOf("datetime"), iC = head.indexOf("close");
        rows = lines.slice(1).map(l => l.split(/[;,]/)).map(f => [f[iD], Number(f[iC])]);
      } else payload = JSON.parse(t);
    }
    if (payload && typeof payload === "object" && !rows.length) {
      if (payload.status === "error" || (payload.code && !payload.values)) {
        const code = Number(payload.code);
        throw new DataError(code === 401 ? "Twelve Data didn't accept your key. Check it in settings." : code === 429 ? (/day/i.test(String(payload.message)) ? "Twelve Data's daily credits are used up (they reset at midnight UTC)." : "Twelve Data limit reached (8 a minute).") :
          code === 400 || code === 404 ? "Ticker not found. Use US symbols like KO or PEP." : String(payload.message || "Twelve Data error"), code === 401 ? "key" : code === 429 ? "limit" : "other");
      }
      rows = (payload.values || []).map(v => [v.datetime, Number(v.close)]);
    }
    rows = rows.filter(r => r[0] && r[1] > 0);
    if (!rows.length) throw new DataError("No prices returned for that ticker.", "symbol");
    return rows.sort((x, y) => (x[0] < y[0] ? -1 : 1));
  }
  async function tdBars(sym, interval, outputsize) {
    if (inClaude) {
      const mcp = await caps.mcp;
      if (!mcp) throw new DataError("Prices can't load in this view.");
      try {
        const res = await mcp.callTool("Twelve Data", "get_time_series", { symbol: sym, interval, outputsize }, { cache: { staleTime: 30000, gcTime: 3600000 } });
        const text = (res.content || []).find(c => c.type === "text");
        return parseBars(res.payload != null ? res.payload : text && text.text);
      } catch (e) {
        if (e instanceof DataError) throw e;
        throw new DataError(e && e.code === "server_not_connected" ? "Connect Twelve Data in claude.ai → Settings → Connectors." : `Couldn't reach Twelve Data${e && e.message ? `: ${e.message}` : ""}.`);
      }
    }
    const key = local.get("tdkey");
    if (!key) throw new DataError("Add your Twelve Data key.", "key");
    let r;
    try { r = await fetch(`https://api.twelvedata.com/time_series?symbol=${encodeURIComponent(sym)}&interval=${interval}&outputsize=${outputsize}&apikey=${encodeURIComponent(key)}`); }
    catch { throw new DataError("Couldn't reach Twelve Data. Check your connection."); }
    return parseBars(await r.json());
  }
  function lastClosedSession() { // the latest weekday whose regular session has finished
    const { ny, wd } = phaseNow();
    let d = ny.day;
    if (wd >= 5 || ny.min < CLOSE + 20) do { d = E.addDays(d, -1); } while (E.weekday(d) >= 5);
    return d;
  }
  async function daily(sym) { // ~6 years of daily closes, saved in this browser; at most 1 credit per stock per day
    const c = local.get("td." + sym);
    if (c && (c.last >= lastClosedSession() || Date.now() - c.fetchedAt < 12 * 3600 * 1000)) return c.series;
    try {
      const series = {};
      for (const [d, v] of await tdBars(sym, "1day", 1600)) series[d.slice(0, 10)] = v;
      local.set("td." + sym, { fetchedAt: Date.now(), last: Object.keys(series).sort().pop(), series });
      return series;
    } catch (e) {
      if (c && e.kind !== "symbol") { S.fallback = e.message; return c.series; } // keep going on the saved history
      throw e;
    }
  }
  async function finnhubQuote(sym) {
    const key = local.get("fhkey");
    if (!key || inClaude) return null;
    try {
      const r = await fetch(`https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(sym)}&token=${encodeURIComponent(key)}`);
      const q = await r.json();
      return q && q.c > 0 && q.t ? q : null;
    } catch { return null; }
  }
  async function intraday(sym) { // today's 1-minute bars; a saved copy (or a Finnhub quote) stands in when Twelve Data can't answer
    try {
      const rows = await tdBars(sym, "1min", 390), day = rows[rows.length - 1][0].slice(0, 10);
      local.set("bars." + sym, { day, rows: rows.filter(r => r[0].startsWith(day)) });
      return rows;
    } catch (e) {
      if (e.kind === "key" || e.kind === "symbol") throw e;
      const c = local.get("bars." + sym);
      if (c && c.rows && c.rows.length) { S.fallback = e.message; return c.rows; }
      const q = await finnhubQuote(sym);
      if (q) { S.fallback = e.message; const ny = nyParts(q.t * 1000); return [[`${ny.day} ${pad2(ny.min / 60)}:${pad2(ny.min % 60)}:00`, q.c]]; }
      throw e;
    }
  }

  // ------------------------------------------------------------ Finnhub live trade stream
  const Live = {
    ws: null, want: [], state: "off", msg: "", retry: null,
    connect() {
      const key = local.get("fhkey");
      if (inClaude || !key) { this.state = "off"; return; }
      if (this.ws && this.ws.readyState <= 1) return;
      this.state = "connecting";
      const ws = this.ws = new WebSocket(`wss://ws.finnhub.io?token=${encodeURIComponent(key)}`);
      ws.onopen = () => { this.state = "open"; this.msg = ""; for (const s of this.want) ws.send(JSON.stringify({ type: "subscribe", symbol: s })); paint(); };
      ws.onmessage = ev => {
        let m; try { m = JSON.parse(ev.data); } catch { return; }
        if (m.type === "trade") for (const d of m.data || []) onTrade(d.s, d.p, d.t);
        else if (m.type === "error") { this.msg = m.msg || "Stream error"; paint(); }
      };
      ws.onclose = () => {
        this.state = "closed"; paint();
        clearTimeout(this.retry);
        if (this.want.length) this.retry = setTimeout(() => this.connect(), 5000);
      };
      ws.onerror = () => { this.msg = "Couldn't connect to Finnhub. Check your key in settings."; };
    },
    watch(symbols) {
      const ws = this.ws, open = ws && ws.readyState === 1;
      for (const s of this.want) if (!symbols.includes(s) && open) ws.send(JSON.stringify({ type: "unsubscribe", symbol: s }));
      for (const s of symbols) if (!this.want.includes(s) && open) ws.send(JSON.stringify({ type: "subscribe", symbol: s }));
      this.want = [...symbols];
      this.connect();
    },
    reset() { if (this.ws) { this.ws.onclose = null; this.ws.close(); } this.ws = null; this.state = "off"; this.connect(); },
  };

  // ------------------------------------------------------------ state
  const prefs = local.get("prefs3") || {};
  const S = {
    cfg: { ...E.defaultConfig() }, pair: prefs.pair || ["KO", "PEP"], custom: prefs.custom || [],
    status: "idle", error: null, hist: null, model: null, session: null, prev: null,
    pts: [], last: {}, lastTick: 0, dirty: false, prec: null, mc: null, mcAt: 0, mcBusy: false, mcErr: null,
    sheet: null, watch: null, toast: null, loadId: 0,
    open: new Set(), // which "more detail" sections the user has opened; kept across redraws
    fallback: null, pauseUntil: 0, lastM: 0, savedAt: 0, // data-source fallbacks and the saved live line
  };
  const savedRisk = local.get("risk");
  if (savedRisk) S.cfg = { ...S.cfg, signal: { ...S.cfg.signal, ...(savedRisk.signal || {}) }, risk: { ...S.cfg.risk, ...(savedRisk.risk || {}) } };
  const savePrefs = () => local.set("prefs3", { pair: S.pair, custom: S.custom });
  const key = p => p.join("/");
  function pairList() {
    const seen = new Set(), out = [];
    const add = (p, group) => { const k = key(p); if (!seen.has(k)) { seen.add(k); out.push({ p, group }); } };
    for (const p of (S.watch && S.watch.pairs || []).map(x => x.p.split("/"))) add(p, "Watcher");
    for (const p of S.custom) add(p, "My pairs");
    for (const p of PRESETS) add(p, "Popular");
    add(S.pair, "My pairs");
    return out;
  }

  // ------------------------------------------------------------ model: σ bands from the 90 trading days before today
  function buildModel(a, b, ha, hb, session, lastA, lastB) {
    const series = { [a]: {}, [b]: {} };
    for (const d of Object.keys(ha)) if (d < session && hb[d] != null) { series[a][d] = ha[d]; series[b][d] = hb[d]; }
    series[a][session] = lastA; series[b][session] = lastB;
    const md = E.fromSeries(series, { rate: S.cfg.data.risk_free_rate });
    const t = md.dates.length - 1;
    const sig = E.computeSignal(E.logs(md.closes[a]), E.logs(md.closes[b]), t, S.cfg.signal, md.dates[t]);
    if (bad(sig.z)) throw new DataError(sig.reasons[0] || "Not enough history for this pair.");
    const mean = sig.spread - sig.z * sig.resid_std;
    return { md, sig, alpha: sig.alpha, beta: sig.beta, mean, sd: sig.resid_std, prevA: md.closes[a][t - 1], prevB: md.closes[b][t - 1] };
  }
  const zOf = (pa, pb) => (Math.log(pa) - S.model.alpha - S.model.beta * Math.log(pb) - S.model.mean) / S.model.sd;

  async function loadPair(a, b, { silent = false } = {}) {
    const id = ++S.loadId;
    S.pair = [a, b]; savePrefs();
    if (!silent) { S.fallback = null; S.status = "loading"; S.error = null; S.pts = []; S.last = {}; S.mc = null; S.mcErr = null; S.prec = null; S.model = null; S.facIn = null; S.fac = null; paint(true); }
    try {
      const [ha, hb] = [await daily(a), await daily(b)];
      const [ia, ib] = [await intraday(a), await intraday(b)];
      if (id !== S.loadId) return;
      const session = [ia[ia.length - 1][0], ib[ib.length - 1][0]].sort().pop().slice(0, 10);
      const minOf = dt => { const [h, m] = dt.slice(11, 16).split(":").map(Number); return h * 60 + m; };
      const ra = ia.filter(r => r[0].startsWith(session)), rb = ib.filter(r => r[0].startsWith(session));
      const pts = [];
      let j = 0;
      for (const [dt, pa] of ra) { // pair each price of A with B's latest price at that minute
        while (j + 1 < rb.length && rb[j + 1][0] <= dt) j++;
        if (rb.length) pts.push({ m: minOf(dt), a: pa, b: rb[j][1] });
      }
      const kept = local.get("pts." + key([a, b])); // the live line saved earlier today in this browser
      if (kept && kept.session === session) {
        const lastM = pts.length ? pts[pts.length - 1].m : -1;
        for (const p of kept.pts) if (p.m > lastM) pts.push(p);
      }
      if (!pts.length) throw new DataError("No trades today yet for this pair.");
      const lastPt = pts[pts.length - 1];
      S.model = buildModel(a, b, ha, hb, session, lastPt.a, lastPt.b);
      S.session = session; S.pts = pts; S.hist = { [a]: ha, [b]: hb };
      S.last = { [a]: { p: lastPt.a, t: 0 }, [b]: { p: lastPt.b, t: 0 } };
      S.status = "ready";
      Live.watch([a, b]);
      loadFactors(a, b, session, id);
      if (S.fromAlert) runModel(); else updateTrade(true);
    } catch (e) {
      if (id !== S.loadId) return;
      if (silent && S.status === "ready") { // keep showing the last good data
        if (e.kind === "limit") { S.fallback = e.message; S.pauseUntil = Date.now() + 10 * 60000; paint(); }
        return;
      }
      S.status = "error"; S.error = { msg: e.message, kind: e.kind };
    }
    paint(!silent);
  }

  function onTrade(sym, price, t) {
    if (S.status !== "ready" || !S.last[sym] || !(price > 0)) return;
    const ny = nyParts(t);
    if (ny.min < PRE || ny.min > POST) return; // overnight prints (rare, off-exchange) are skipped
    if (ny.day < S.session) return;
    if (ny.day > S.session) rollSession(ny.day);
    S.last[sym] = { p: price, t };
    S.lastM = ny.min;
    if (!S.pts.length) S.pts.push({ m: ny.min, a: S.last[S.pair[0]].p, b: S.last[S.pair[1]].p }); // first point of a new day
    S.lastTick = Date.now(); S.dirty = true;
  }
  setInterval(() => { // fold the latest trades into the chart every 2 seconds
    if (!S.dirty || S.status !== "ready") return;
    S.dirty = false;
    const [a, b] = S.pair, ny = nyParts(Date.now());
    const pt = { m: S.lastM || ny.min, a: S.last[a].p, b: S.last[b].p };
    const prev = S.pts[S.pts.length - 1];
    if (prev && pt.m - prev.m < 5 / 60) S.pts[S.pts.length - 1] = pt; else S.pts.push(pt);
    if (S.pts.length > 4000) S.pts = S.pts.filter((_, i) => i % 2 === 0);
    if (Date.now() - S.savedAt > 30000) savePts();
    updateTrade(false);
    paint();
  }, 2000);
  function savePts() { // keep today's live line so a reload (or a Twelve Data outage) doesn't lose it
    S.savedAt = Date.now();
    const n = Math.ceil(S.pts.length / 1500), pts = n > 1 ? S.pts.filter((_, i) => i % n === 0 || i === S.pts.length - 1) : S.pts;
    local.set("pts." + key(S.pair), { session: S.session, pts: pts.map(p => ({ m: +p.m.toFixed(2), a: p.a, b: p.b })) });
  }
  function rollSession(day) { // first trade of a new day: start a fresh line from yesterday's close, no new downloads
    const [a, b] = S.pair, reg = S.pts.filter(p => p.m <= CLOSE), lp = reg[reg.length - 1];
    if (lp) { S.hist[a] = { ...S.hist[a], [S.session]: lp.a }; S.hist[b] = { ...S.hist[b], [S.session]: lp.b }; }
    try { S.model = buildModel(a, b, S.hist[a], S.hist[b], day, S.last[a].p, S.last[b].p); } catch { return; }
    S.session = day; S.pts = []; S.prec = null; S.mc = null; S.fac = null; S.facIn = null; S.mcErr = null;
    loadFactors(a, b, day, S.loadId);
  }
  setInterval(() => { if (S.status === "ready") paint(); }, 15000); // keep "updated Xs ago" honest when quiet

  // ------------------------------------------------------------ market factors: earnings, news, S&P 500
  async function finnhub(path, params) {
    const key = local.get("fhkey");
    if (!key || inClaude) return null;
    try {
      const r = await fetch(`https://finnhub.io/api/v1/${path}?${new URLSearchParams({ ...params, token: key })}`);
      if (!r.ok) return null; // e.g. not included in the plan
      return await r.json();
    } catch { return null; }
  }
  // ------------------------------------------------------------ real option chains (MarketData.app, last closed session)
  const MD_FIELDS = ["s", "expiration", "side", "strike", "bid", "ask", "volume", "openInterest", "updated", "underlyingPrice"];
  async function optionChain(sym, spot) { // -> {payload} or {error}
    const key = local.get("mdkey");
    if (inClaude) return { error: "real option quotes load at your web address" };
    if (!key) return { error: "add a MarketData.app token in settings for real quotes" };
    const want = lastClosedSession(), saved = local.get("chain." + sym);
    if (saved && saved.for === want && saved.payload) return saved;
    let d = want;
    for (let i = 0; i < 5; i++) {
      let r, body;
      try {
        r = await fetch(`https://api.marketdata.app/v1/options/chain/${encodeURIComponent(sym)}/?${new URLSearchParams(E.chainRequest(sym, d, spot))}`,
                        { headers: { Authorization: `Bearer ${key}`, Accept: "application/json" } });
        body = await r.json().catch(() => ({}));
      } catch { return saved && saved.payload ? { ...saved, stale: true } : { error: "couldn't reach MarketData.app" }; }
      const later = r.status === 402 && /latest available is (\d{4}-\d{2}-\d{2})/.exec(body.errmsg || "");
      if (later && later[1] < d) { d = later[1]; continue; } // free plan: sessions are served a day after they close
      if (!r.ok) {
        const why = { 401: "MarketData.app didn't accept your token", 402: "not on your MarketData.app plan", 403: "your MarketData.app token is in use from another place (the cloud watcher?); try again in 5 minutes", 429: "MarketData.app's daily credits are used up" }[r.status] || `MarketData.app error ${r.status}`;
        return saved && saved.payload ? { ...saved, stale: true, note: why } : { error: why };
      }
      if (body.s === "ok") {
        const payload = Object.fromEntries(MD_FIELDS.map(k => [k, body[k]]));
        const out = { for: want, payload };
        local.set("chain." + sym, out);
        return out;
      }
      if (body.s !== "no_data") return { error: `MarketData.app: ${body.errmsg || "unexpected answer"}` };
      do { d = E.addDays(d, -1); } while (E.weekday(d) >= 5); // holiday or not published yet: one session earlier
    }
    return { error: `no option chain for ${sym} in the last 5 sessions` };
  }

  async function loadFactors(a, b, session, id) {
    const chainsP = Promise.all([a, b].map(sym => optionChain(sym, S.last[sym] ? S.last[sym].p : S.hist[sym][Object.keys(S.hist[sym]).sort().pop()])));
    const from = E.addDays(session, -3 * 365), to = E.addDays(session, 60), nfrom = E.addDays(session, -33);
    const earnings = {}, news = {};
    let haveE = true, haveN = true;
    for (const sym of [a, b]) {
      const ec = await finnhub("calendar/earnings", { symbol: sym, from, to });
      if (ec && Array.isArray(ec.earningsCalendar)) earnings[sym] = ec.earningsCalendar.filter(r => r.date).map(r => ({ date: r.date, hour: r.hour || "" }));
      else haveE = false;
      const nw = await finnhub("company-news", { symbol: sym, from: nfrom, to: session });
      if (Array.isArray(nw)) news[sym] = nw.filter(n => n.datetime && n.headline).map(n => ({ datetime: n.datetime, headline: n.headline, url: n.url || "" }));
      else haveN = false;
    }
    let market = null;
    try { market = await daily("SPY"); } catch { market = null; }
    const got = await chainsP, chains = {}, chainProblems = [];
    [a, b].forEach((sym, i) => {
      const c = got[i], ch = c.payload ? E.parseChain(c.payload, sym) : null;
      if (ch) chains[sym] = ch; else chainProblems.push(c.error || `no usable option quotes for ${sym}`);
      if (c.note) chainProblems.push(c.note + " (using the saved chain)");
    });
    if (id !== S.loadId) return;
    S.facIn = { earnings: haveE ? earnings : null, news: haveN ? news : null, market, chains, chainProblems: [...new Set(chainProblems)], stamp: Date.now() };
    if (S.mc && !S.mcBusy) runModel(); // fold the factors into the current analysis
  }

  // ------------------------------------------------------------ options model: Monte Carlo over every call/put combination
  const inRegular = () => { const l = S.pts[S.pts.length - 1]; return !!l && l.m >= OPEN && l.m <= CLOSE + 1; };
  const isSignal = () => S.status === "ready" && inRegular() && S.model.sig.eligible && Math.abs(zOf(S.last[S.pair[0]].p, S.last[S.pair[1]].p)) >= S.cfg.signal.entry_z;
  function updateTrade(force) { if (isSignal() && (force || !S.mc || Date.now() - S.mcAt > 60000)) runModel(); } // re-run at most once a minute
  function runModel() {
    if (S.status !== "ready" || S.mcBusy) return;
    S.mcBusy = true; paint();
    const id = S.loadId;
    setTimeout(() => {
      try {
        const [a, b] = S.pair;
        const md = E.withRealChains(buildModel(a, b, S.hist[a], S.hist[b], S.session, S.last[a].p, S.last[b].p).md, (S.facIn && S.facIn.chains) || {});
        if (!S.prec) S.prec = E.precedent(md, S.pair, S.cfg);
        const fi = S.facIn || {};
        const fac = E.buildFactors(md, S.pair, md.dates.length - 1, S.cfg, fi.earnings || null, fi.news || null, fi.market || null);
        const plan = E.monteCarloPlan(md, S.pair, S.cfg, null, 4000, S.prec, null, fac.model);
        if (id === S.loadId) { S.mc = plan; S.fac = fac; S.mcAt = Date.now(); S.mcErr = null; S.mcFacStamp = S.facIn && S.facIn.stamp; }
      } catch (e) { if (id === S.loadId) S.mcErr = e.message; }
      S.mcBusy = false; paint();
      if (S.fromAlert) { S.fromAlert = false; const el = document.getElementById("model-card"); if (el) el.scrollIntoView({ block: "start" }); }
      if (id === S.loadId && S.mc && S.facIn && S.facIn.stamp !== S.mcFacStamp) runModel(); // factors arrived mid-run
    }, 40);
  }

  // ------------------------------------------------------------ watcher status line (ntfy), once a minute
  async function fetchWatch() {
    const topic = local.get("ntfytopic");
    if (!topic || inClaude) return;
    try {
      const r = await fetch(`https://ntfy.sh/${encodeURIComponent(topic)}-status/json?poll=1&since=latest`);
      const msgs = (await r.text()).trim().split("\n").filter(Boolean).map(l => JSON.parse(l)).filter(m => m.event === "message");
      if (msgs.length) { S.watch = JSON.parse(msgs[msgs.length - 1].message); paint(true); }
    } catch { /* status line just stays as it was */ }
  }

  // ------------------------------------------------------------ charts
  const W = 720;
  function axis(h, pb) {
    const ph = phaseNow().phase;
    const ext = S.pts.some(p => p.m < OPEN || p.m > CLOSE) || ((ph === "pre" || ph === "post") && Live.state === "open");
    if (!ext) {
      const X = m => 8 + (W - 64) * (Math.min(Math.max(m, OPEN), CLOSE) - OPEN) / (CLOSE - OPEN);
      let s = "";
      for (const [m, l] of [[OPEN, "9:30"], [720, "12:00"], [CLOSE, "4:00 ET"]]) s += `<text x="${X(m).toFixed(1)}" y="${h - 4}" text-anchor="${m === OPEN ? "start" : m === CLOSE ? "end" : "middle"}">${l}</text>`;
      return { X, s, bg: "" };
    }
    // pre-market and after-hours get narrow shaded strips either side of the regular session
    const segs = [[PRE, OPEN, 0, 0.17], [OPEN, CLOSE, 0.17, 0.83], [CLOSE, POST, 0.83, 1]];
    const X = m => { m = Math.min(Math.max(m, PRE), POST); const g = segs.find(q => m <= q[1]); return 8 + (W - 64) * (g[2] + (g[3] - g[2]) * (m - g[0]) / (g[1] - g[0])); };
    let s = "";
    for (const [m, l, an] of [[PRE, "4:00", "start"], [OPEN, "9:30", "middle"], [CLOSE, "4:00", "middle"], [POST, "8:00 ET", "end"]]) s += `<text x="${X(m).toFixed(1)}" y="${h - 4}" text-anchor="${an}">${l}</text>`;
    const strip = (m0, m1, t) => `<rect class="ext" x="${X(m0).toFixed(1)}" y="0" width="${(X(m1) - X(m0)).toFixed(1)}" height="${h - pb}"/><text class="ext-t" x="${((X(m0) + X(m1)) / 2).toFixed(1)}" y="12" text-anchor="middle">${t}</text>`;
    return { X, s, bg: strip(PRE, OPEN, "Pre") + strip(CLOSE, POST, "After") };
  }
  function pathOf(pts, X, Y, f) { return pts.map((p, i) => `${i ? "L" : "M"}${X(p.m).toFixed(1)},${Y(f(p)).toFixed(1)}`).join(""); }

  function priceChart() {
    const [a, b] = S.pair, H = 230, pt = 12, pb = 22, M = S.model;
    const ca = p => p.a / M.prevA - 1, cb = p => p.b / M.prevB - 1;
    const vals = S.pts.flatMap(p => [ca(p), cb(p)]);
    let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals); const pad = Math.max((hi - lo) * 0.12, 0.002); lo -= pad; hi += pad;
    const { X, s: ax, bg } = axis(H, pb), Y = v => pt + (H - pt - pb) * (1 - (v - lo) / (hi - lo));
    const last = S.pts[S.pts.length - 1];
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(a)} and ${esc(b)} change today">${bg}
      <line class="zero" x1="8" x2="${W - 56}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}"/>
      <path class="ln-b" d="${pathOf(S.pts, X, Y, cb)}"/><path class="ln-a" d="${pathOf(S.pts, X, Y, ca)}"/>
      <circle class="dot live" cx="${X(last.m).toFixed(1)}" cy="${Y(ca(last)).toFixed(1)}" r="4.5"/>
      <circle class="dot b" cx="${X(last.m).toFixed(1)}" cy="${Y(cb(last)).toFixed(1)}" r="4"/>
      <text x="${W - 50}" y="${(Y(ca(last)) + 4).toFixed(1)}" class="tag-a">${esc(a)}</text>
      <text x="${W - 50}" y="${(Y(cb(last)) + 4 + (Math.abs(Y(ca(last)) - Y(cb(last))) < 14 ? 13 : 0)).toFixed(1)}">${esc(b)}</text>
      ${ax}</svg>`;
  }

  function driftChart() {
    const H = 230, pt = 10, pb = 22, zs = S.pts.map(p => zOf(p.a, p.b));
    const lim = Math.max(2.6, ...zs.map(z => Math.abs(z) + 0.3));
    const { X, s: ax, bg } = axis(H, pb), Y = v => pt + (H - pt - pb) * (1 - (v + lim) / (2 * lim));
    const band = (y0, y1, cls) => `<rect class="${cls}" x="8" width="${W - 64}" y="${Y(y1).toFixed(1)}" height="${(Y(y0) - Y(y1)).toFixed(1)}"/>`;
    const last = S.pts[S.pts.length - 1], zl = zs[zs.length - 1];
    let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Drift in standard deviations">`;
    s += band(2, lim, "zone-out") + band(-lim, -2, "zone-out") + band(1, 2, "zone-2") + band(-2, -1, "zone-2") + band(-1, 1, "zone-1") + bg;
    for (const v of [2, 1, 0, -1, -2]) s += `<line class="${v ? "band-l" : "zero"}" x1="8" x2="${W - 56}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text x="${W - 50}" y="${(Y(v) + 4).toFixed(1)}">${v ? (v > 0 ? "+" : "−") + Math.abs(v) + "σ" : "0"}</text>`;
    s += `<path class="ln-z" d="${pathOf(S.pts.map((p, i) => ({ m: p.m, z: zs[i] })), X, Y, p => p.z)}"/>`;
    s += `<circle class="dot live" cx="${X(last.m).toFixed(1)}" cy="${Y(zl).toFixed(1)}" r="5"/>`;
    return s + ax + "</svg>";
  }

  // ------------------------------------------------------------ view
  function nextLive() { // when trading (pre-market) starts again
    const { ny, wd } = phaseNow();
    let d = ny.day;
    if (wd >= 5 || ny.min >= POST) do { d = E.addDays(d, 1); } while (E.weekday(d) >= 5);
    return d === ny.day ? "4:00 ET" : `${new Date(d + "T00:00:00Z").toLocaleDateString("en-US", { weekday: "short", timeZone: "UTC" })} 4:00 ET`;
  }
  function liveBadge() {
    const ph = phaseNow().phase;
    if (inClaude) return `<span class="pill">${S.pauseUntil > Date.now() ? "Paused · Twelve Data limit" : ph === "open" ? "Refreshes every minute" : `Market closed · ${esc(dDay(S.session))}`}</span>`;
    if (!local.get("fhkey")) return `<button class="pill warn-pill" data-act="sheet" data-s="settings">Live off · add Finnhub key</button>`;
    if (ph === "closed") return `<span class="pill">Closed · live again ${esc(nextLive())}</span>`;
    const tag = ph === "pre" ? "Pre-market" : ph === "post" ? "After hours" : "Live";
    if (Live.state === "open") return `<span class="pill up pulse">${tag}${S.lastTick ? ` · ${esc(ago(S.lastTick))}` : ""}</span>`;
    return `<span class="pill drift">${Live.state === "connecting" ? "Connecting…" : "Reconnecting…"}</span>`;
  }

  function viewPair() {
    if (S.status === "loading") return `<section class="card empty"><span class="spin big-spin"></span><p class="note">Loading ${esc(pairLabel(S.pair))}…</p></section>`;
    if (S.status === "error") return `<section class="card empty"><h3 class="mid">Couldn't load ${esc(pairLabel(S.pair))}</h3><p class="note">${esc(S.error.msg)}</p>
      <div class="row-btns">${S.error.kind === "key" ? `<button class="btn primary" data-act="sheet" data-s="settings">Open settings</button>` : ""}<button class="btn" data-act="retry">Try again</button></div></section>`;
    if (S.status !== "ready") return "";
    const [a, b] = S.pair, M = S.model, la = S.last[a].p, lb = S.last[b].p, z = zOf(la, lb), az = Math.abs(z), entry = S.cfg.signal.entry_z;
    const band = az < 1 ? ["Within 1σ", ""] : az < 2 ? ["Within 2σ", "drift"] : ["Beyond 2σ", "down"];
    const rich = z > 0 ? a : b;
    const unstable = !M.sig.eligible;
    const chg = (p, prev) => p / prev - 1;
    return `
      <section class="card">
        <div class="head"><div class="quotes">
            <div><span class="sym"><i class="sw a"></i>${esc(a)}</span><span class="px">${cents(la)}</span><span class="${chg(la, M.prevA) >= 0 ? "up" : "down"} small">${pct(chg(la, M.prevA))}</span></div>
            <div><span class="sym"><i class="sw b"></i>${esc(b)}</span><span class="px">${cents(lb)}</span><span class="${chg(lb, M.prevB) >= 0 ? "up" : "down"} small">${pct(chg(lb, M.prevB))}</span></div>
          </div>${liveBadge()}</div>
        ${priceChart()}
        ${S.fallback ? `<p class="note">${esc(S.fallback)} ${inClaude ? "Showing the last prices; trying again in a few minutes." : "Using prices saved in this browser; live updates keep coming from Finnhub."}</p>` : ""}
      </section>
      <section class="card">
        <div class="head"><div><span class="label">Drift between them</span><div class="big ${band[1]}">${zf(z)}σ</div>
          <div class="small muted">${az < 0.5 ? "Moving in step" : `${esc(rich)} is ${az < 1 ? "slightly" : az < 2 ? "noticeably" : "unusually"} rich vs ${esc(rich === a ? b : a)}`}</div></div>
          <span class="pill ${band[1]}">${band[0]}</span></div>
        ${driftChart()}
        <div class="legend"><span><i class="zk z1"></i>Within 1σ (normal)</span><span><i class="zk z2"></i>1–2σ</span><span><i class="zk zo"></i>Beyond ${entry}σ: trade signal</span></div>
        ${unstable ? `<p class="note warn">This pair isn't moving together reliably right now (${esc(M.sig.reasons[0])}), so drift here isn't a signal.</p>` : ""}
      </section>
`;
  }

  const legLine = l => `<div class="leg"><span class="tag ${l.right === "C" ? "call" : "put"}">${l.right === "C" ? "CALL" : "PUT"}</span>
    <div><div class="t">Buy ${l.contracts} ${esc(l.symbol)} ${l.right === "C" ? "call" : "put"}${l.contracts > 1 ? "s" : ""}</div><div class="s">$${l.strike} strike · expires ${dShort(l.expiry)}${l.quote && !l.quote.modeled
      ? ` · bid ${cents(l.quote.bid)} / ask ${cents(l.quote.ask)} · ${l.quote.open_interest.toLocaleString()} open · IV ${pct(l.quote.iv, 0, false)}` : ""}</div></div>
    <div class="r">${money(l.entry_price * 100 * l.contracts)}</div></div>`;
  const comboName = c => c.legs.map(l => `${l.contracts} ${l.symbol} ${l.right === "C" ? "call" : "put"}${l.contracts > 1 ? "s" : ""} $${l.strike}`).join(" + ");

  function cloudChart(plan) { // every combination scored: win chance (x) vs expected return on the money at risk (y)
    const Wc = 720, Hc = 260, pl = 52, pr = 14, pt = 12, pb = 34, best = plan.top[0], lead = plan.overall[0];
    const ys = plan.cloud.map(p => p[1]);
    let lo = Math.min(0, ...ys), hi = Math.max(0, ...ys); const pad = (hi - lo) * 0.08 || 0.1; lo -= pad; hi += pad;
    const X = v => pl + (Wc - pl - pr) * v, Y = v => pt + (Hc - pt - pb) * (1 - (v - lo) / (hi - lo));
    const step = Math.max(1, Math.ceil(plan.cloud.length / 2500));
    let dots = "", hot = "";
    plan.cloud.forEach((p, i) => {
      if (p[2]) hot += `<circle class="cd-pair" cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="2.6"/>`;
      else if (i % step === 0) dots += `<circle class="cd" cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="2"/>`;
    });
    let s = `<svg class="chart" viewBox="0 0 ${Wc} ${Hc}" role="img" aria-label="All combinations: win chance against expected return">`;
    for (const v of [0, 0.25, 0.5, 0.75, 1]) s += `<line class="band-l" x1="${X(v)}" x2="${X(v)}" y1="${pt}" y2="${Hc - pb}"/><text x="${X(v)}" y="${Hc - 18}" text-anchor="middle">${v * 100}%</text>`;
    s += `<line class="zero" x1="${pl}" x2="${Wc - pr}" y1="${Y(0)}" y2="${Y(0)}"/>`;
    for (const v of [hi - pad, 0, lo + pad]) s += `<text x="${pl - 6}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end">${pct(v, 0)}</text>`;
    s += dots + hot;
    if (lead && !lead.aligned) s += `<rect class="cd-lead" x="${(X(lead.pop) - 6).toFixed(1)}" y="${(Y(lead.score) - 6).toFixed(1)}" width="12" height="12" transform="rotate(45 ${X(lead.pop).toFixed(1)} ${Y(lead.score).toFixed(1)})"/>`;
    if (best) s += `<circle class="cd-best" cx="${X(best.pop).toFixed(1)}" cy="${Y(best.score).toFixed(1)}" r="8"/>`;
    s += `<text x="${(pl + Wc - pr) / 2}" y="${Hc - 2}" text-anchor="middle">Win chance →</text>`;
    return s + "</svg>";
  }

  function saleView(c, plan) { // when to expect to sell, from the simulations, with the pair's history alongside
    const e = c.exit, base = S.session, on = k => E.addBusdays(base, Math.max(1, Math.round(e[k])));
    const prec = plan.precedent, dLong2 = d => new Date(d + "T00:00:00Z").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" });
    const why = [["closed", "the gap closes"], ["time", "the time limit"], ["expiry", "expiry nears"], ["stopped", "the gap blows out"]]
      .filter(([k]) => e[k] >= 0.005).map(([k, t]) => `${t} ${pct(e[k], 0, false)}`).join(" · ");
    return `<div class="sale"><div class="label">Expected sale</div>
      <div class="mid">${esc(dLong2(on("p50")))}</div>
      <div class="small muted">Likely between ${esc(dShort(on("p25")))} and ${esc(dShort(on("p75")))}${on("p90") > on("p75") ? ` · 9 in 10 by ${esc(dShort(on("p90")))}` : ""}</div>
      <div class="small muted">What ends the trade in the simulations: ${why}</div>
      ${prec && (prec.median_days != null || prec.median_hold != null) ? `<div class="small muted">History: ${prec.median_days != null ? `past drifts on this pair closed in ~${Math.round(prec.median_days)} trading days` : ""}${prec.median_days != null && prec.median_hold != null ? " · " : ""}${prec.median_hold != null ? `the rules held past trades ~${Math.round(prec.median_hold)} days` : ""}</div>` : ""}
      <div class="small muted">The live page and phone alert tell you when the exit rules actually trigger.</div></div>`;
  }

  function factorsView(plan) {
    const f = S.fac;
    if (!f) return "";
    const brk = (plan.regimes.find(r => r.name === "Relationship breaks") || {}).weight;
    const rows = [];
    for (const ev of f.events) rows.push(`<div class="item" style="cursor:default"><span><span class="t">${esc(labelOf(ev.symbol))} reports earnings ${esc(dShort(ev.date))}</span>
      <span class="s">Day ${ev.day} of the trade · typical move ±${(ev.sigma * 100).toFixed(1)}% (${esc(ev.basis)}) · simulated as a jump</span></span><span class="r drift">Event</span></div>`);
    for (const h of f.headlines.slice(0, 4)) rows.push(`<div class="item" style="cursor:default"><span><span class="t">${h.url ? `<a href="${esc(h.url)}" target="_blank" rel="noopener">${esc(h.headline)}</a>` : esc(h.headline)}</span>
      <span class="s">${esc(h.symbol)} · ${esc(dShort(h.date))}</span></span><span class="r ${h.flag ? "down" : "faint"}">${h.flag ? esc(h.flag) : "news"}</span></div>`);
    const effect = [];
    if (f.break_boost > 0) effect.push(`News raised the chance the pair breaks apart to ${pct(brk, 0, false)} of simulations`);
    if (Math.abs(f.stress - 1) >= 0.05) effect.push(`Market stress ${f.stress > 1 ? "adds weight to volatile and shock" : "adds weight to calm"} markets (×${f.stress.toFixed(2)})`);
    return `<div><div class="label">Market factors</div>
      ${f.notes.filter(n => n.startsWith("Market ") || n.startsWith("Unusually")).map(n => `<p class="note">${esc(n)}</p>`).join("")}
      ${rows.length ? `<div class="list">${rows.join("")}</div>` : f.missing.length ? "" : `<p class="note">No earnings in the trade window and no notable headlines.</p>`}
      ${effect.length ? `<p class="note warn">${esc(effect.join(". "))}.</p>` : ""}
      ${f.missing.length ? `<p class="note">Not checked: ${esc(f.missing.join(", "))}${inClaude ? " (available at your web address)" : !local.get("fhkey") ? " (add a Finnhub key in settings)" : ""}.</p>` : ""}</div>`;
  }

  function sourceView(c) { // real quotes or modeled prices, said plainly
    const qs = c.legs.map(l => l.quote).filter(Boolean), real = qs.length && qs.every(q => !q.modeled);
    const probs = (S.facIn && S.facIn.chainProblems) || [];
    if (real) {
      const d = qs[0].as_of.slice(0, 10);
      return `<p class="note"><span class="pill up">Real quotes</span> Option bids and asks from MarketData.app at the ${esc(dDay(d))} close (the free plan is one session behind), adjusted to today's stock price using each contract's own implied volatility.${probs.length ? ` ${esc(probs.join("; "))}.` : ""}</p>`;
    }
    return `<p class="note"><span class="pill">Modeled prices</span> Option prices here are calculated from the stock's real prices and volatility, not market quotes${probs.length ? `: ${esc(probs.join("; "))}` : ""}.</p>`;
  }

  function viewModel(z) {
    const entry = S.cfg.signal.entry_z, signal = isSignal(), plan = S.mc;
    const head = `<div class="head"><div><h3 class="mid">Options model</h3><div class="small muted">Monte Carlo · every call/put combination</div></div>
      ${signal ? `<span class="pill down">Signal</span>` : `<span class="pill">No signal</span>`}</div>`;
    if (!plan) return `<section class="card${S.mcBusy ? "" : " quiet"}" id="model-card">${head}
      ${S.mcBusy ? `<p class="note"><span class="spin"></span>Simulating 4,000 markets and scoring every combination…</p>` : `
      <p class="note">${signal ? "Preparing…" : `Runs automatically when the drift passes ±${entry}σ (now ${zf(z)}σ${S.model.sig.eligible ? "" : ", and the pair is unstable"}).`}</p>
      ${S.mcErr ? `<p class="note warn">${esc(S.mcErr)}</p>` : ""}
      <div><button class="btn sm" data-act="run-model">Run the model now</button></div>`}</section>`;
    const c = plan.top[0], lead = plan.overall[0], cal = plan.calibration, prec = plan.precedent;
    const summary = `Scored <b>${plan.combos.toLocaleString()}</b> call/put combinations across <b>${plan.paths.toLocaleString()}</b> simulated markets
      (${plan.regimes.length} regimes, next ${plan.horizon} trading days) at drift ${zf(plan.z)}σ · ${esc(ago(S.mcAt))}${S.mcBusy ? ` · <span class="spin"></span>updating` : ""}`;
    if (!c) return `<section class="card">${head}<p class="note">${summary}.</p>
      <p class="note warn">No balanced pairs trade fits your risk limit (max ${money(S.cfg.risk.max_loss_per_trade_pct * S.cfg.risk.starting_equity)} per trade).</p></section>`;
    const maxAbs = Math.max(...Object.values(c.by_regime).map(Math.abs), 1);
    const regimes = plan.regimes.map(r => {
      const v = c.by_regime[r.name] ?? 0, w = Math.abs(v) / maxAbs * 50;
      return `<div class="bar"><div>${esc(r.name)}<small>${pct(r.weight, 0, false)} of paths</small></div>
        <div class="track"><i style="left:${v >= 0 ? 50 : 50 - w}%;width:${w}%;background:var(${v >= 0 ? "--up" : "--down"})"></i><span class="zero-l"></span></div>
        <div class="val ${v >= 0 ? "up" : "down"}">${money(v, true)}</div></div>`;
    }).join("");
    const det = c.scenarios.map(s => `<div class="item" style="cursor:default"><span><span class="t">${esc(s.name)}</span><span class="s">${esc(s.when)}</span></span>
      <span class="r ${s.pnl >= 0 ? "up" : "down"}">${money(s.pnl, true)}</span></div>`).join("");
    return `<section class="card ${signal ? "signal" : ""}" id="model-card">${head}
      <p class="note">${summary}</p>
      <div class="label">Best pairs trade</div>
      ${c.legs.map(legLine).join("")}
      ${sourceView(c)}
      <div class="stats">
        <div class="stat"><span class="label">Max loss</span><span class="v">${money(c.cost)}</span></div>
        <div class="stat"><span class="label">Win chance</span><span class="v">${pct(c.pop, 0, false)}</span></div>
        <div class="stat"><span class="label">Expected P&amp;L</span><span class="v ${c.ev >= 0 ? "up" : "down"}">${money(c.ev, true)}</span></div>
        <div class="stat"><span class="label">Expected return</span><span class="v ${c.score >= 0 ? "up" : "down"}">${pct(c.score, 0)}</span></div>
        <div class="stat"><span class="label">Median outcome</span><span class="v ${c.median >= 0 ? "up" : "down"}">${money(c.median, true)}</span></div>
        <div class="stat"><span class="label">Worst 5% (avg)</span><span class="v down">${money(c.cvar5, true)}</span></div>
      </div>
      ${c.ev <= 0 ? `<p class="note warn">Even the best balanced combination loses money on average in these simulations. Consider skipping this one.</p>` : ""}
      ${saleView(c, plan)}
      ${factorsView(plan)}
      <div><div class="label">Outcome by market regime</div><div class="bars">${regimes}</div></div>
      <div><div class="label">All ${plan.combos.toLocaleString()} combinations</div>${cloudChart(plan)}
        <div class="legend"><span><i class="cdk best"></i>Suggested</span><span><i class="cdk pair"></i>Balanced pairs trades</span><span><i class="cdk"></i>Other combinations</span>${lead && !lead.aligned ? `<span><i class="cdk lead"></i>Top overall</span>` : ""}</div></div>
      ${lead && !lead.aligned && lead.score > c.score ? `<p class="note">Highest-scoring overall: <b>${esc(comboName(lead))}</b> (${pct(lead.score, 0)} expected return). It's a bet on the market's direction, not a hedged pairs trade, so it isn't suggested.</p>` : ""}
      <details data-k="scen" ${S.open.has("scen") ? "open" : ""}><summary>Fixed scenarios for the suggested trade</summary><div class="list">${det}</div>
        <p class="note">Greeks: ${money(c.greeks.delta_per_1pct, true)} per 1% move in both stocks · time decay ${money(c.greeks.theta_per_day, true)}/day · ${money(c.greeks.vega_per_point, true)} per volatility point.</p></details>
      ${plan.top.length > 1 ? `<details data-k="runners" ${S.open.has("runners") ? "open" : ""}><summary>Runners-up</summary><div class="list">${plan.top.slice(1).map(r => `<div class="item" style="cursor:default"><span><span class="t">${esc(comboName(r))}</span><span class="s">max loss ${money(r.cost)} · win chance ${pct(r.pop, 0, false)}</span></span><span class="r ${r.ev >= 0 ? "up" : "down"}">${money(r.ev, true)}</span></div>`).join("")}</div></details>` : ""}
      <details data-k="inputs" ${S.open.has("inputs") ? "open" : ""}><summary>Model inputs</summary><p class="note">
        Hedge ratio ${cal.beta.toFixed(2)} (±${(2 * cal.beta_se).toFixed(2)}) · gap half-life ${Number.isFinite(cal.half_life) ? cal.half_life.toFixed(1) + " days" : "none"} · correlation ${cal.correlation.toFixed(2)} · Dickey-Fuller t ${cal.adf_t.toFixed(2)} ·
        ${esc(S.pair[1])} daily volatility ${pct(cal.daily_vol_b, 2, false)} · ${cal.history_days} historical days replayed.<br>
        Regimes: ${plan.regimes.map(r => `${esc(r.name)} ${pct(r.weight, 0, false)}`).join(", ")}.<br>
        ${prec && prec.n ? `Precedent: ${prec.closed} of ${prec.n} past drifts closed${prec.median_days != null ? `, median ${Math.round(prec.median_days)} trading days` : ""}. ` : ""}
        In the simulations the gap closed within ${plan.horizon} days on ${pct(plan.converged_share, 0, false)} of paths (median exit day ${plan.median_exit_day}).
        Only bought options are considered, so the max loss is what you pay.</p></details>
      <p class="note">${c.legs.every(l => l.quote && !l.quote.modeled) ? "Quotes are from the last close and the regimes are assumptions." : "Option prices are modeled and the regimes are assumptions."} Check live quotes with your broker before trading. Not financial advice.</p>
      <div><button class="btn sm" data-act="run-model">Re-run</button></div>
    </section>`;
  }

  function watchLine() {
    const w = S.watch;
    if (inClaude) return `Live streaming runs at <a href="${PAGES_URL}" target="_blank" rel="noopener">${esc(PAGES_URL.replace("https://", "").replace(/\/$/, ""))}</a>`;
    if (!w) return local.get("ntfytopic") ? "Watcher: no status yet" : "Phone alerts: add your alert topic in settings to see the watcher here";
    const last = new Date(w.last || w.at).getTime(), stale = w.open && Date.now() - last > 25 * 60000;
    return `Watcher ${w.open ? (stale ? "delayed" : "live") : "idle (market closed)"} · last check ${esc(ago(last))} · ${plural((w.alerts || []).length, "alert")} sent recently`;
  }

  function sheetView() {
    if (S.sheet === "settings") {
      const f = (id, label, val, help, type = "password") => `<div class="field"><label class="label" for="${id}">${label}</label>
        <input class="input plain" id="${id}" type="${type}" placeholder="${val}" autocomplete="off" spellcheck="false">${help ? `<small>${help}</small>` : ""}</div>`;
      const n = (sec, k, label, scale, step) => `<div class="field"><label class="label" for="n-${k}">${label}</label>
        <input class="input plain" id="n-${k}" type="number" step="${step}" data-sec="${sec}" data-key="${k}" data-scale="${scale}" value="${+(S.cfg[sec][k] * scale).toFixed(4)}"></div>`;
      return sheet(`<h2>Settings</h2>
        ${inClaude ? `<p class="note">Prices come from your Twelve Data connector. Live streaming runs at your web address.</p>` : `
        ${f("k-td", "Twelve Data key (history)", local.get("tdkey") ? "Saved · paste to replace" : "Required", "Free at twelvedata.com → Account → API keys.")}
        ${f("k-fh", "Finnhub key (live trades)", local.get("fhkey") ? "Saved · paste to replace" : "For live updates", "Free at finnhub.io → Dashboard → API key.")}
        ${f("k-md", "MarketData.app token (real option quotes)", local.get("mdkey") ? "Saved · paste to replace" : "Optional", "Free at marketdata.app → Dashboard → Generate token. Quotes are from the last close.")}
        ${f("k-nt", "Alert topic (watcher status)", local.get("ntfytopic") ? "Saved · paste to replace" : "pairslab-…", "")}`}
        ${n("signal", "entry_z", "Trade signal at (σ)", 1, 0.1)}
        ${n("risk", "starting_equity", "Account size for sizing ($)", 1, 1000)}
        ${n("risk", "max_loss_per_trade_pct", "Max loss per trade (%)", 100, 0.5)}
        <p class="note">Keys stay in this browser and go only to Twelve Data, Finnhub, MarketData.app and ntfy.</p>
        <button class="btn primary block" data-act="save-settings">Save</button>`);
    }
    if (S.sheet === "add") return sheet(`<h2>Add a pair</h2><p class="note">Two companies in the same business tend to work best.</p>
      <div class="pickers"><input class="input" id="add-a" placeholder="KO" aria-label="First ticker"><span>/</span><input class="input" id="add-b" placeholder="PEP" aria-label="Second ticker"></div>
      <button class="btn primary block" data-act="add-pair">Track this pair</button>`);
    return "";
  }
  const sheet = body => `<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">${body}<button class="btn block" data-act="sheet-close">Close</button></div></div>`;

  function setupView() {
    return `<section class="card"><h3 class="mid">Connect your data</h3>
      <p class="note">Two free keys: Twelve Data for price history and the σ bands, Finnhub for live trades. They stay in this browser.</p>
      <div class="field"><label class="label" for="k-td">Twelve Data key</label><input class="input plain" id="k-td" type="password" autocomplete="off"><small>twelvedata.com → Account → API keys</small></div>
      <div class="field"><label class="label" for="k-fh">Finnhub key</label><input class="input plain" id="k-fh" type="password" autocomplete="off"><small>finnhub.io → Dashboard (optional; without it the chart doesn't move)</small></div>
      <button class="btn primary block" data-act="save-settings">Start</button></section>`;
  }

  // ------------------------------------------------------------ render: the shell once, the live area on every update
  function paint(full = false) {
    if (full || !document.getElementById("live")) {
      const list = pairList(), groups = [...new Set(list.map(x => x.group))];
      app.innerHTML = `
        <header class="top"><div class="top-in">
          <span class="brand">Pairs Lab</span>
          <div class="select-wrap"><select id="pair-select" aria-label="Pair">
            ${groups.map(g => `<optgroup label="${esc(g)}">${list.filter(x => x.group === g).map(x => `<option value="${esc(key(x.p))}" ${key(x.p) === key(S.pair) ? "selected" : ""}>${esc(pairLabel(x.p))}</option>`).join("")}</optgroup>`).join("")}
            <option value="__add">+ Add a pair…</option></select></div>
          <button class="icon-btn" data-act="sheet" data-s="settings" aria-label="Settings">${ICON.gear}</button>
        </div></header>
        <main><div id="live" style="display:contents"></div><div id="model-root" style="display:contents"></div></main>
        <p class="foot" id="watch-line"></p>
        <div id="sheet-root"></div><div id="toast-root"></div>`;
    }
    const needKeys = !inClaude && !local.get("tdkey");
    document.getElementById("live").innerHTML = needKeys ? setupView() : viewPair();
    // The model card only redraws when its content changes, so open sections, hover and text selection survive live ticks.
    const mh = !needKeys && S.status === "ready" ? viewModel(zOf(S.last[S.pair[0]].p, S.last[S.pair[1]].p)) : "";
    const mr = document.getElementById("model-root");
    if (mr._html !== mh) { mr.innerHTML = mh; mr._html = mh; }
    document.getElementById("watch-line").innerHTML = `${watchLine()}<br>Paper analysis only · option prices modeled · not financial advice`;
    const sr = document.getElementById("sheet-root");
    if (sr.dataset.sheet !== (S.sheet || "")) { sr.innerHTML = sheetView(); sr.dataset.sheet = S.sheet || ""; }
    document.getElementById("toast-root").innerHTML = S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : "";
  }
  let toastT;
  function toast(m) { S.toast = m; paint(); clearTimeout(toastT); toastT = setTimeout(() => { S.toast = null; paint(); }, 3000); }

  // ------------------------------------------------------------ events
  app.addEventListener("change", ev => {
    if (ev.target.id !== "pair-select") return;
    const v = ev.target.value;
    if (v === "__add") { ev.target.value = key(S.pair); S.sheet = "add"; paint(); return; }
    loadPair(...v.split("/"));
  });
  app.addEventListener("click", ev => {
    const el = ev.target.closest("[data-act]");
    if (!el) return;
    const act = el.dataset.act;
    if (act === "scrim" && ev.target !== el) return;
    if (act === "sheet") { S.sheet = el.dataset.s; paint(); }
    else if (act === "sheet-close" || act === "scrim") { S.sheet = null; paint(); }
    else if (act === "retry") loadPair(...S.pair);
    else if (act === "run-model") runModel();
    else if (act === "add-pair") {
      const a = document.getElementById("add-a").value.trim().toUpperCase(), b = document.getElementById("add-b").value.trim().toUpperCase();
      if (!/^[A-Z.\-]{1,10}$/.test(a) || !/^[A-Z.\-]{1,10}$/.test(b) || a === b) { toast("Enter two different tickers"); return; }
      if (!S.custom.some(p => key(p) === key([a, b]))) S.custom.push([a, b]);
      ensureNames([a, b]);
      S.sheet = null; savePrefs(); loadPair(a, b);
    } else if (act === "save-settings") {
      const val = id => ((document.getElementById(id) || {}).value || "").trim();
      const td = val("k-td"), fh = val("k-fh"), nt = val("k-nt"), mdk = val("k-md");
      if (td) local.set("tdkey", td);
      if (mdk && mdk !== local.get("mdkey")) { local.set("mdkey", mdk); for (const s of S.pair) local.set("chain." + s, null); }
      const fhChanged = fh && fh !== local.get("fhkey");
      if (fh) local.set("fhkey", fh);
      if (/^[\w-]{6,64}$/.test(nt)) { local.set("ntfytopic", nt.replace(/-status$/, "")); fetchWatch(); }
      for (const inp of app.querySelectorAll("input[data-key]")) {
        const v = Number(inp.value);
        if (Number.isFinite(v) && v > 0) S.cfg[inp.dataset.sec] = { ...S.cfg[inp.dataset.sec], [inp.dataset.key]: v / Number(inp.dataset.scale) };
      }
      local.set("risk", { signal: { entry_z: S.cfg.signal.entry_z }, risk: { starting_equity: S.cfg.risk.starting_equity, max_loss_per_trade_pct: S.cfg.risk.max_loss_per_trade_pct } });
      S.sheet = null;
      if (fhChanged) Live.reset();
      loadPair(...S.pair);
    }
  });
  app.addEventListener("toggle", ev => { // remember opened sections (toggle doesn't bubble, so listen while capturing)
    const k = ev.target.dataset && ev.target.dataset.k;
    if (k) { if (ev.target.open) S.open.add(k); else S.open.delete(k); }
  }, true);
  app.addEventListener("keydown", ev => { if (ev.key === "Escape" && S.sheet) { S.sheet = null; paint(); } });

  // ------------------------------------------------------------ boot
  const link = /^#([A-Za-z.]{1,10})-([A-Za-z.]{1,10})$/.exec(location.hash); // opened from a phone alert
  if (link) { S.pair = [link[1].toUpperCase(), link[2].toUpperCase()]; S.fromAlert = true; }
  paint(true);
  if (inClaude || local.get("tdkey")) loadPair(...S.pair);
  fetchWatch();
  ensureNames([...new Set(pairList().flatMap(x => x.p))]);
  setInterval(fetchWatch, 60000);
  if (inClaude) setInterval(() => { // Twelve Data has no extended hours on the free plan, so only refresh while the market is open
    if (S.status === "ready" && document.visibilityState === "visible" && phaseNow().phase === "open" && Date.now() > S.pauseUntil) loadPair(...S.pair, { silent: true });
  }, 60000);
})();
</script>
</body></html>
