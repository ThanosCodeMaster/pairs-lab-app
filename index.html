<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pairs Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Practice pairs trading with options using paper money. Educational, not financial advice.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Layout: one calm column, like a brokerage app. Two screens (Analyze, Positions),
   sheets slide up for settings and confirmations. Black pill buttons, big numbers,
   colour only for gains, losses and drift. */
:root {
  --bg: #f6f6f2; --card: #ffffff; --ink: #141413; --muted: #6c6c66; --faint: #a6a6a0; --line: #e8e8e2; --chip: #ededE7;
  --primary: #141413; --on-primary: #ffffff;
  --up: #0b7a4b; --up-soft: #e2f3e9; --down: #c2312b; --down-soft: #fbe6e4; --drift: #a86400; --drift-soft: #fbefd8;
  --line-a: #141413; --line-b: #a09f98;
  --f: "Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 20px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e0e0d; --card: #181817; --ink: #f2f2ee; --muted: #9c9c96; --faint: #686863; --line: #262624; --chip: #23231f;
  --primary: #f2f2ee; --on-primary: #111110;
  --up: #43d08f; --up-soft: #12301f; --down: #ff6f65; --down-soft: #3a1714; --drift: #f0b44c; --drift-soft: #36290f;
  --line-a: #f2f2ee; --line-b: #73736c; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e0e0d; --card: #181817; --ink: #f2f2ee; --muted: #9c9c96; --faint: #686863; --line: #262624; --chip: #23231f;
  --primary: #f2f2ee; --on-primary: #111110;
  --up: #43d08f; --up-soft: #12301f; --down: #ff6f65; --down-soft: #3a1714; --drift: #f0b44c; --drift-soft: #36290f;
  --line-a: #f2f2ee; --line-b: #73736c; color-scheme: dark; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 500 15px/1.5 var(--f); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
.num, .big, td.r { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 8px; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.top-in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { font-weight: 800; font-size: 1.15rem; letter-spacing: -0.02em; margin-right: auto; }
.seg { display: inline-flex; justify-self: start; width: max-content; max-width: 100%; background: var(--chip); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; padding: 7px 16px; border-radius: 999px; font-weight: 700; font-size: .9rem; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px color-mix(in srgb, var(--ink) 12%, transparent); }
.seg .badge { display: inline-grid; place-items: center; min-width: 18px; height: 18px; margin-left: 6px; border-radius: 9px; background: var(--ink); color: var(--bg); font-size: .7rem; }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--chip); display: grid; place-items: center; cursor: pointer; }
.icon-btn svg { width: 18px; height: 18px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

main { max-width: 760px; margin: 0 auto; display: grid; gap: 14px; padding-block: 8px 72px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.card { background: var(--card); border-radius: var(--r); padding: 20px; display: grid; gap: 16px; min-width: 0;
  box-shadow: 0 1px 2px color-mix(in srgb, var(--ink) 5%, transparent); }
.label { font-size: .78rem; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.up { color: var(--up); } .down { color: var(--down); } .drift { color: var(--drift); }
.small { font-size: .85rem; }
.big { font-size: 2.6rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; }
.mid { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; }
.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.pair-name { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; }

/* chips, pills, buttons */
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 0; background: var(--chip); padding: 8px 14px; border-radius: 999px; font-weight: 700; font-size: .88rem; cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; font-weight: 700; font-size: .82rem; background: var(--chip); color: var(--muted); white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.drift { background: var(--drift-soft); color: var(--drift); }
.pill.up { background: var(--up-soft); color: var(--up); }
.pill.down { background: var(--down-soft); color: var(--down); }
.btn { border: 0; border-radius: 999px; padding: 13px 22px; font-weight: 800; cursor: pointer; background: var(--chip); }
.btn.primary { background: var(--primary); color: var(--on-primary); }
.btn.block { width: 100%; }
.card > .btn.sm, .card > a.btn { justify-self: start; text-decoration: none; }
.btn.sm { padding: 8px 14px; font-size: .88rem; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.link { border: 0; background: none; padding: 0; font-weight: 700; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* inputs */
.pickers { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.pickers span { color: var(--faint); font-weight: 800; }
.input { width: 100%; border: 0; background: var(--chip); border-radius: 14px; padding: 12px 14px; font-weight: 700; text-transform: uppercase; }
.input.plain { text-transform: none; font-weight: 600; }
.field { display: grid; gap: 6px; }
.field small { color: var(--muted); font-size: .8rem; }

/* stats */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px 20px; }
.stat { display: grid; gap: 2px; }
.stat .v { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }

/* charts */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--faint); font: 600 11px var(--f); }
.ln-a { fill: none; stroke: var(--line-a); stroke-width: 2; stroke-linejoin: round; }
.ln-b { fill: none; stroke: var(--line-b); stroke-width: 2; stroke-linejoin: round; }
.ln-z { fill: none; stroke: var(--line-a); stroke-width: 1.8; stroke-linejoin: round; }
.shade { fill: var(--drift-soft); }
.shade.sel { fill: color-mix(in srgb, var(--drift) 30%, transparent); }
.band { stroke: var(--drift); stroke-dasharray: 4 4; stroke-width: 1; }
.zero { stroke: var(--line); stroke-width: 1; }
.dot { fill: var(--line-a); stroke: var(--card); stroke-width: 2; }
.legend { display: flex; gap: 16px; font-size: .82rem; font-weight: 700; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.spark { width: 100%; height: 56px; display: block; }
.spark path.l { fill: none; stroke-width: 2; }
.spark path.a { stroke: none; opacity: .14; }
.brand { white-space: nowrap; }
@media (max-width: 560px) { .chart text { font-size: 22px; } .big { font-size: 2.2rem; }
  .brand { font-size: 1rem; } .top-in { gap: 8px; } .top .seg button { padding: 7px 12px; } .icon-btn { width: 34px; height: 34px; } }
@media (max-width: 380px) { .brand { display: none; } .top .seg { margin-right: auto; } }

/* lists */
.list { display: grid; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 14px 0; border-top: 1px solid var(--line); align-items: center;
  background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; cursor: pointer; }
.item:first-child { border-top: 0; }
.item .t { display: block; font-weight: 800; }
.item .s { display: block; font-size: .84rem; color: var(--muted); }
.item .r { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
.item[aria-expanded="true"] { padding-bottom: 6px; }
.detail { padding: 4px 0 16px; display: grid; gap: 12px; }

/* trade legs */
.leg { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
.tag { font-size: .72rem; font-weight: 800; letter-spacing: .04em; padding: 6px 9px; border-radius: 9px; }
.tag.call { background: var(--up-soft); color: var(--up); }
.tag.put { background: var(--down-soft); color: var(--down); }
.leg .t { font-weight: 800; }
.leg .s { font-size: .84rem; color: var(--muted); }
.leg .r { font-weight: 800; font-variant-numeric: tabular-nums; }
.note { font-size: .86rem; color: var(--muted); }
.note.warn { color: var(--drift); }
.divider { height: 1px; background: var(--line); }

/* progress */
.prog { height: 8px; border-radius: 4px; background: var(--chip); overflow: hidden; }
.prog i { display: block; height: 100%; border-radius: 4px; background: var(--ink); }

/* replay bar */
.replay { display: flex; align-items: center; gap: 8px; background: var(--ink); color: var(--bg); border-radius: 999px; padding: 6px 6px 6px 16px; font-weight: 700; font-size: .88rem; }
.replay .grow { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.replay button { border: 0; background: color-mix(in srgb, var(--bg) 16%, transparent); color: var(--bg); border-radius: 999px; padding: 6px 12px; font-weight: 800; cursor: pointer; }

/* sheet */
.scrim { position: fixed; inset: 0; z-index: 40; background: color-mix(in srgb, #000 40%, transparent); display: grid; align-items: end; justify-items: center; }
.sheet { width: min(520px, 100%); max-height: 88vh; overflow: auto; background: var(--card); border-radius: 24px 24px 0 0; display: grid; gap: 16px;
  padding: 22px max(20px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); }
@media (min-width: 640px) { .scrim { align-items: center; } .sheet { border-radius: 24px; } }
.sheet h2 { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.02em; }
.sheet ul { margin: 0; padding-left: 1.1rem; display: grid; gap: 8px; }

.empty { text-align: center; padding: 28px 8px; display: grid; gap: 10px; justify-items: center; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 50;
  background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 999px; font-weight: 700; max-width: calc(100% - 32px); }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
.foot { text-align: center; font-size: .78rem; color: var(--faint); }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
</style>

<div id="app"><p style="padding:24px;font:16px system-ui">Loading Pairs Lab…</p></div>
<noscript><p style="padding:24px">Pairs Lab needs JavaScript turned on.</p></noscript>
<script>
/* Pairs Lab engine: a line-by-line port of the Python package in statarb/.
 * The Python code is the reference implementation (it has the unit tests);
 * app/parity_check.py verifies this port reproduces its backtest exactly.
 * Educational tool. Not financial advice. No live trading exists here. */
"use strict";
const Engine = (() => {

  // ---------------------------------------------------------------- dates (ISO strings, UTC)
  const toDate = s => new Date(s + "T00:00:00Z");
  const iso = d => d.toISOString().slice(0, 10);
  const addDays = (s, n) => { const d = toDate(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
  const daysBetween = (a, b) => Math.round((toDate(b) - toDate(a)) / 86400000); // b - a
  const weekday = s => (toDate(s).getUTCDay() + 6) % 7; // Monday = 0

  // ---------------------------------------------------------------- math helpers
  // Hart (1968) double-precision normal CDF.
  function normCdf(x) {
    const z = Math.abs(x);
    let c = 0;
    if (z <= 37) {
      const e = Math.exp(-z * z / 2);
      if (z < 7.07106781186547) {
        const n = ((((((0.0352624965998911 * z + 0.700383064443688) * z + 6.37396220353165) * z + 33.912866078383) * z
          + 112.079291497871) * z + 221.213596169931) * z + 220.206867912376);
        const d = (((((((0.0883883476483184 * z + 1.75566716318264) * z + 16.064177579207) * z + 86.7807322029461) * z
          + 296.564248779674) * z + 637.333633378831) * z + 793.826512519948) * z + 440.413735824752);
        c = e * n / d;
      } else {
        let b = z + 0.65; b = z + 4 / b; b = z + 3 / b; b = z + 2 / b; b = z + 1 / b;
        c = e / b / 2.506628274631;
      }
    }
    return x > 0 ? 1 - c : c;
  }
  const normPdf = x => Math.exp(-0.5 * x * x) / Math.sqrt(2 * Math.PI);

  function mulberry32(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function normal(rng, mu = 0, sd = 1) {
    const u = 1 - rng(), v = rng();
    return mu + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
    return t;
  })();
  function crc32(str) {
    let c = 0xFFFFFFFF;
    for (const ch of new TextEncoder().encode(str)) c = CRC_TABLE[(c ^ ch) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  const seeded = (...parts) => mulberry32(crc32(parts.join("|")));

  const sum = a => { let s = 0; for (const v of a) s += v; return s; };
  const mean = a => sum(a) / a.length;
  function std(a, ddof = 1) {
    const m = mean(a);
    let s = 0; for (const v of a) s += (v - m) * (v - m);
    return Math.sqrt(s / (a.length - ddof));
  }
  function percentile(a, p) { // numpy's default (linear interpolation)
    const s = [...a].sort((x, y) => x - y);
    const pos = (s.length - 1) * p / 100, lo = Math.floor(pos), hi = Math.min(lo + 1, s.length - 1);
    return s[lo] + (s[hi] - s[lo]) * (pos - lo);
  }
  function roundHalfEven(x) { // Python's round()
    const r = Math.round(x);
    return Math.abs(x % 1) === 0.5 && r % 2 !== 0 ? r - 1 : r;
  }
  const diff = a => { const out = new Array(a.length - 1); for (let i = 1; i < a.length; i++) out[i - 1] = a[i] - a[i - 1]; return out; };

  // ---------------------------------------------------------------- config (same keys as config/default.toml)
  function defaultConfig() {
    return {
      signal: { lookback: 90, entry_z: 2.0, entry_z_grid: [1.5, 2.0, 2.5], exit_z: 0.5, stop_z: 4.0, max_hold_days: 20,
                min_correlation: 0.6, max_adf_t: -3.0, min_half_life: 2.0, max_half_life: 30.0 },
      options: { min_dte: 21, max_dte: 60, exit_dte: 7, max_hedge_mismatch: 0.30 },
      costs: { commission_per_contract: 0.65, fees_per_contract: 0.02, slippage_spread_fraction: 0.10, slippage_fixed: 0.01 },
      liquidity: { min_bid: 0.05, max_spread_pct: 0.10, min_open_interest: 100, min_volume: 10,
                   max_volume_participation: 0.05, max_oi_participation: 0.02 },
      risk: { starting_equity: 25000, max_loss_per_trade_pct: 0.02, max_total_premium_pct: 0.06, max_open_trades: 3,
              max_contracts_per_leg: 10, kill_switch_drawdown_pct: 0.15 },
      walk_forward: { train_days: 252, test_days: 63, min_train_trades: 3, bootstrap_samples: 2000, seed: 7 },
      data: { risk_free_rate: 0.04, max_staleness_days: 4, max_abs_daily_move: 0.25, universe_selected_as_of: null },
      live_trading_enabled: false,
    };
  }

  // ---------------------------------------------------------------- pricing (Black-Scholes)
  const CALL = "C", PUT = "P";
  const intrinsic = (spot, strike, right) => right === CALL ? Math.max(spot - strike, 0) : Math.max(strike - spot, 0);

  function bsPrice(spot, strike, t, rate, vol, right) {
    if (t <= 0) return intrinsic(spot, strike, right);
    if (vol <= 0) {
      const f = spot - strike * Math.exp(-rate * t);
      return right === CALL ? Math.max(f, 0) : Math.max(-f, 0);
    }
    const sq = Math.sqrt(t);
    const d1 = (Math.log(spot / strike) + (rate + 0.5 * vol * vol) * t) / (vol * sq), d2 = d1 - vol * sq;
    const disc = Math.exp(-rate * t);
    return right === CALL ? spot * normCdf(d1) - strike * disc * normCdf(d2)
                          : strike * disc * normCdf(-d2) - spot * normCdf(-d1);
  }

  function bsGreeks(spot, strike, t, rate, vol, right) {
    if (t <= 0 || vol <= 0) {
      const itm = intrinsic(spot, strike, right) > 0;
      return { delta: right === CALL ? (itm ? 1 : 0) : (itm ? -1 : 0), gamma: 0, vega: 0, theta: 0 };
    }
    const sq = Math.sqrt(t);
    const d1 = (Math.log(spot / strike) + (rate + 0.5 * vol * vol) * t) / (vol * sq), d2 = d1 - vol * sq;
    const disc = Math.exp(-rate * t);
    const gamma = normPdf(d1) / (spot * vol * sq), vega = spot * normPdf(d1) * sq / 100;
    const common = -spot * normPdf(d1) * vol / (2 * sq);
    let delta, theta;
    if (right === CALL) { delta = normCdf(d1); theta = common - rate * strike * disc * normCdf(d2); }
    else { delta = normCdf(d1) - 1; theta = common + rate * strike * disc * normCdf(-d2); }
    return { delta, gamma, vega, theta: theta / 365 };
  }

  function impliedVol(price, spot, strike, t, rate, right, lo = 1e-4, hi = 5.0, tol = 1e-7) {
    if (t <= 0 || price <= 0) return null;
    if (!(bsPrice(spot, strike, t, rate, lo, right) - 1e-9 <= price && price <= bsPrice(spot, strike, t, rate, hi, right) + 1e-9)) return null;
    for (let i = 0; i < 200; i++) {
      const mid = 0.5 * (lo + hi);
      if (bsPrice(spot, strike, t, rate, mid, right) < price) lo = mid; else hi = mid;
      if (hi - lo < tol) break;
    }
    return 0.5 * (lo + hi);
  }

  // ---------------------------------------------------------------- quotes and market data
  const qKey = q => `${q.underlying} ${q.expiry} ${q.strike}${q.right}`;
  const qDte = q => daysBetween(q.quote_date, q.expiry);
  const qMid = q => (q.bid == null || q.ask == null) ? null : 0.5 * (q.bid + q.ask);
  const qSpread = q => (q.bid == null || q.ask == null) ? null : q.ask - q.bid;
  const qSpreadPct = q => { const m = qMid(q); return (m == null || m <= 0) ? null : qSpread(q) / m; };

  const mdClose = (md, sym, i) => { const v = md.closes[sym][i]; return Number.isNaN(v) ? null : v; };
  function truncated(md, until) {
    const n = md.dates.filter(d => d <= until).length;
    if (n === 0) throw new Error(`${until} is before the first data date ${md.dates[0]}`);
    const closes = {};
    for (const [s, c] of Object.entries(md.closes)) closes[s] = c.slice(0, n);
    return { ...md, dates: md.dates.slice(0, n), closes };
  }

  // ---------------------------------------------------------------- synthetic data (always labeled)
  const SYNTHETIC = "SYNTHETIC";
  function thirdFriday(y, m) {
    const first = iso(new Date(Date.UTC(y, m - 1, 1)));
    return addDays(first, ((4 - weekday(first)) % 7 + 7) % 7 + 14);
  }
  function monthlyExpiries(d, horizon = 100) {
    const out = [], end = addDays(d, horizon);
    let y = +d.slice(0, 4), m = +d.slice(5, 7);
    for (;;) {
      const e = thirdFriday(y, m);
      if (e > end) return out;
      if (e > d) out.push(e);
      if (m === 12) { y++; m = 1; } else m++;
    }
  }
  const strikeStep = spot => spot < 100 ? 1.0 : 5.0;

  // Option quotes built from a pricing model on top of daily closes. Used for
  // practice data, and for real stocks, whose historical option chains are not
  // available on free data plans. Every quote is marked modeled: true.
  class SyntheticOptions {
    constructor(dates, closes, rate, { source = SYNTHETIC, noise = true } = {}) {
      this.dates = dates; this.closes = closes; this.rate = rate; this.source = source; this.noise = noise;
      this.idx = new Map(dates.map((d, i) => [d, i]));
    }
    spot(sym, d) { const i = this.idx.get(d); if (i == null) return null; const v = this.closes[sym][i]; return Number.isNaN(v) ? null : v; }
    atmIv(sym, d) {
      const i = this.idx.get(d);
      const w = Array.from(this.closes[sym].slice(Math.max(0, i - 20), i + 1)).filter(v => !Number.isNaN(v));
      const rets = diff(w.map(Math.log));
      const realized = rets.length >= 10 ? std(rets) * Math.sqrt(252) : 0.25;
      const noise = this.noise ? normal(seeded(sym, d), 0, 0.01) : 0;
      return Math.min(1.5, Math.max(0.08, realized * 1.15 + noise));
    }
    build(sym, d, expiry, strike, right, spot, atmIv) {
      const t = daysBetween(d, expiry) / 365, m = Math.log(strike / spot);
      const iv = Math.max(0.05, atmIv - 0.25 * m);
      const mid = bsPrice(spot, strike, t, this.rate, iv, right);
      const half = Math.max(0.01, mid * (0.03 + 0.25 * Math.abs(m)) / 2);
      const bid = Math.floor((mid - half) * 100) / 100, ask = Math.ceil((mid + half) * 100) / 100;
      const r = seeded(sym, d, expiry, strike, right);
      return {
        underlying: sym, quote_date: d, expiry, strike, right, bid: Math.max(bid, 0), ask: Math.max(ask, 0.01), iv,
        volume: Math.floor(900 * Math.exp(-30 * m * m) * (0.5 + r())),
        open_interest: Math.floor(6000 * Math.exp(-15 * m * m) * (0.5 + r())),
        as_of: `${d} 16:00`, delay_minutes: null, source: this.source, modeled: true,
      };
    }
    chain(sym, d) {
      const spot = this.spot(sym, d);
      if (spot == null) return [];
      const iv = this.atmIv(sym, d), step = strikeStep(spot);
      const lo = Math.floor(spot * 0.85 / step) * step, hi = Math.ceil(spot * 1.15 / step) * step;
      const out = [];
      for (const e of monthlyExpiries(d)) for (let k = lo; k <= hi + step / 2; k += step) for (const right of [CALL, PUT])
        out.push(this.build(sym, d, e, k, right, spot, iv));
      return out;
    }
    quote(sym, d, expiry, strike, right) {
      const spot = this.spot(sym, d);
      if (spot == null || expiry <= d) return null;
      return this.build(sym, d, expiry, strike, right, spot, this.atmIv(sym, d));
    }
  }

  function makeSynthetic({ nDays = 1000, seed = 42, start = "2021-01-04", symbols = ["SYNA", "SYNB"], rate = 0.04 } = {}) {
    const rng = mulberry32(seed);
    const dates = [];
    for (let d = start; dates.length < nDays; d = addDays(d, 1)) if (weekday(d) < 5) dates.push(d);
    const logB = new Array(nDays);
    let acc = Math.log(52);
    for (let t = 0; t < nDays; t++) { acc += normal(rng, 0.0003, 0.011) + normal(rng, 0, 0.006); logB[t] = acc; }
    const kappa = 0.2, sigma = 0.007, b0 = Math.floor(nDays * 0.62);
    const level = new Array(nDays).fill(0);
    for (let t = b0; t < nDays; t++) level[t] = t < b0 + 40 ? 0.10 * (t - b0) / 39 : 0.10;
    const x = new Array(nDays).fill(0);
    for (let t = 1; t < nDays; t++) x[t] = x[t - 1] + kappa * (level[t] - x[t - 1]) + normal(rng, 0, sigma);
    const r2 = v => Math.round(v * 100) / 100;
    const closes = {
      [symbols[0]]: Float64Array.from(logB.map((lb, t) => r2(Math.exp(Math.log(48) + 0.9 * (lb - Math.log(52)) + x[t])))),
      [symbols[1]]: Float64Array.from(logB.map(lb => r2(Math.exp(lb)))),
    };
    const gap = Math.floor(nDays * 0.3);
    closes[symbols[1]][gap] = NaN; closes[symbols[1]][gap + 1] = NaN; // planted gap for the quality checks
    const meta = {};
    for (const s of symbols) meta[s] = { symbol: s, source: SYNTHETIC, license_note: "Generated in your browser. Made-up prices, not market data.", delay_minutes: null, synthetic: true };
    return { dates, closes, meta, options: new SyntheticOptions(dates, closes, rate), options_modeled: true, rate };
  }

  // Real daily closes (e.g. from Twelve Data) -> market data with modeled options.
  // series: { SYMBOL: { "2024-01-02": 61.2, ... } }. Uses the dates both symbols share.
  function fromSeries(series, { rate = 0.04, maxDays = 1500, meta = {} } = {}) {
    const syms = Object.keys(series);
    let dates = Object.keys(series[syms[0]]).filter(d => syms.every(s => series[s][d] != null)).sort();
    dates = dates.slice(-maxDays);
    const closes = {};
    for (const s of syms) closes[s] = Float64Array.from(dates, d => series[s][d]);
    const m = {};
    for (const s of syms) m[s] = { symbol: s, synthetic: false, delay_minutes: null, ...meta };
    return { dates, closes, meta: m, options_modeled: true, rate,
             options: new SyntheticOptions(dates, closes, rate, { source: "MODEL (from real stock prices)", noise: false }) };
  }

  // ---------------------------------------------------------------- CSV import / export
  function parseCsv(text) {
    const rows = []; let row = [], field = "", q = false;
    text = text.replace(/^﻿/, "");
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
        else field += c;
      } else if (c === '"') q = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(field); field = "";
        if (row.length > 1 || row[0] !== "") rows.push(row);
        row = [];
      } else field += c;
    }
    if (field !== "" || row.length) { row.push(field); rows.push(row); }
    if (!rows.length) return { header: [], records: [] };
    const header = rows[0].map(h => h.trim());
    return { header, records: rows.slice(1).map(r => Object.fromEntries(header.map((h, i) => [h, r[i] ?? ""]))) };
  }
  const PRICE_COLUMNS = ["date", "symbol", "close", "source", "license_note", "delay_minutes"];
  const OPTION_COLUMNS = ["quote_date", "as_of", "underlying", "expiry", "strike", "right", "bid", "ask", "volume", "open_interest", "source", "delay_minutes"];
  const optFloat = s => { s = (s || "").trim(); if (!s) return null; const v = Number(s); if (Number.isNaN(v)) throw new Error(`not a number: ${s}`); return v; };
  const isIsoDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s) && !Number.isNaN(toDate(s).getTime());

  class CsvOptions {
    constructor(quotes) {
      this.byDay = new Map(); this.byKey = new Map();
      for (const q of quotes) {
        const k = q.underlying + "|" + q.quote_date;
        if (!this.byDay.has(k)) this.byDay.set(k, []);
        this.byDay.get(k).push(q);
        this.byKey.set([q.underlying, q.quote_date, q.expiry, q.strike, q.right].join("|"), q);
      }
    }
    chain(sym, d) { return [...(this.byDay.get(sym + "|" + d) || [])]; }
    quote(sym, d, expiry, strike, right) { return this.byKey.get([sym, d, expiry, strike, right].join("|")) || null; }
  }

  function loadCsv(pricesText, optionsText, rate = 0.04) {
    const issues = [];
    const p = parseCsv(pricesText), o = parseCsv(optionsText);
    for (const [name, t, cols] of [["prices.csv", p, PRICE_COLUMNS], ["options.csv", o, OPTION_COLUMNS]]) {
      const missing = cols.filter(c => !t.header.includes(c));
      if (missing.length) throw new Error(`${name} is missing columns: ${missing.sort().join(", ")}`);
    }
    const raw = {}, meta = {};
    p.records.forEach((r, n) => {
      const line = n + 2, sym = (r.symbol || "").trim(), close = Number(r.close);
      if (!isIsoDate(r.date) || !sym || Number.isNaN(close)) { issues.push(`prices line ${line}: unreadable; dropped`); return; }
      if (close <= 0) { issues.push(`prices line ${line}: non-positive close for ${sym}; dropped`); return; }
      (raw[sym] ||= {})[r.date] = close;
      if (!meta[sym]) {
        let delay = null; try { delay = optFloat(r.delay_minutes); } catch { /* shown as unknown */ }
        meta[sym] = { symbol: sym, source: r.source.trim(), license_note: r.license_note.trim(), delay_minutes: delay,
                      synthetic: r.source.trim().toUpperCase().startsWith(SYNTHETIC) };
      }
    });
    const dates = [...new Set(Object.values(raw).flatMap(s => Object.keys(s)))].sort();
    const closes = {};
    for (const [s, series] of Object.entries(raw)) closes[s] = Float64Array.from(dates, d => series[d] ?? NaN);
    const idx = new Map(dates.map((d, i) => [d, i]));
    const quotes = []; let anyModeled = false;
    o.records.forEach((r, n) => {
      const line = n + 2;
      let q;
      try {
        if (!isIsoDate(r.quote_date) || !isIsoDate(r.expiry)) throw new Error("bad date");
        const strike = Number(r.strike); if (Number.isNaN(strike)) throw new Error("bad strike");
        q = { underlying: r.underlying.trim(), quote_date: r.quote_date, expiry: r.expiry, strike, right: r.right.trim().toUpperCase(),
              bid: optFloat(r.bid), ask: optFloat(r.ask), iv: optFloat(r.iv), volume: Math.trunc(Number(r.volume || 0)),
              open_interest: Math.trunc(Number(r.open_interest || 0)), as_of: r.as_of.trim().replace("T", " ").slice(0, 16),
              delay_minutes: optFloat(r.delay_minutes), source: r.source.trim(),
              modeled: ["1", "true", "yes"].includes((r.modeled || "").trim().toLowerCase()) };
        if (Number.isNaN(q.volume) || Number.isNaN(q.open_interest)) throw new Error("bad volume");
      } catch (e) { issues.push(`options line ${line}: unreadable (${e.message}); dropped`); return; }
      if (q.right !== "C" && q.right !== "P") { issues.push(`options line ${line}: right must be C or P; dropped`); return; }
      if (q.bid != null && q.ask != null && (q.bid < 0 || q.bid > q.ask)) { issues.push(`options line ${line}: crossed or negative quote ${qKey(q)}; dropped`); return; }
      if (q.iv == null && qMid(q) && closes[q.underlying] && idx.has(q.quote_date)) {
        const spot = closes[q.underlying][idx.get(q.quote_date)];
        if (!Number.isNaN(spot)) q.iv = impliedVol(qMid(q), spot, q.strike, qDte(q) / 365, rate, q.right);
      }
      anyModeled ||= q.modeled;
      quotes.push(q);
    });
    return { md: { dates, closes, meta, options: new CsvOptions(quotes), options_modeled: anyModeled, rate }, issues };
  }

  function exportCsv(md, lastDays = 500) {
    const start = Math.max(0, md.dates.length - lastDays);
    const P = [PRICE_COLUMNS.join(",")], O = [[...OPTION_COLUMNS, "iv", "modeled"].join(",")];
    const csvq = v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v);
    for (let i = start; i < md.dates.length; i++) {
      for (const [sym, m] of Object.entries(md.meta)) {
        const c = mdClose(md, sym, i);
        if (c != null) P.push([md.dates[i], sym, c, m.source, m.license_note, m.delay_minutes ?? ""].map(csvq).join(","));
      }
      for (const sym of Object.keys(md.meta)) {
        const spot = mdClose(md, sym, i);
        for (const q of md.options.chain(sym, md.dates[i])) {
          if (spot == null || qDte(q) < 14 || qDte(q) > 75 || Math.abs(q.strike / spot - 1) > 0.10) continue;
          O.push([q.quote_date, q.as_of.replace(" ", "T") + ":00", q.underlying, q.expiry, q.strike, q.right, q.bid, q.ask, q.volume,
                  q.open_interest, q.source, q.delay_minutes ?? "", q.iv == null ? "" : q.iv.toFixed(6), String(q.modeled)].map(csvq).join(","));
        }
      }
    }
    return { prices: P.join("\n") + "\n", options: O.join("\n") + "\n" };
  }

  // ---------------------------------------------------------------- data quality (observations only)
  const LEVELS = { ok: 0, info: 1, warn: 2, error: 3 };
  function assess(md, cfg, symbols, { loadIssues = [], backtestStart = null, today = null } = {}) {
    const iEnd = md.dates.length - 1, asOf = md.dates[iEnd], items = [];
    const add = (level, subject, check, detail) => items.push({ level, subject, check, detail });
    const fmt = (ds, k = 5) => ds.slice(0, k).join(", ") + (ds.length > k ? ` (+${ds.length - k} more)` : "");
    for (const sym of symbols) {
      if (!md.closes[sym]) { add("error", sym, "present", "Symbol not found in the price file"); continue; }
      const m = md.meta[sym];
      if (!m.license_note) add("error", sym, "licence", "No licence note. Only use data you are allowed to use.");
      else add("info", sym, "source", `${m.source}: ${m.license_note}`);
      if (m.synthetic) add("warn", sym, "made up", "Practice data: these prices are invented, so results say nothing about real markets");
      if (m.delay_note) add("info", sym, "delay", m.delay_note);
      else if (m.delay_minutes == null) add(m.synthetic ? "info" : "warn", sym, "delay", m.synthetic ? "Delay does not apply to practice data" : "Delay unknown; treat prices as delayed");
      else if (m.delay_minutes > 0) add("info", sym, "delay", `Source says prices are delayed ${m.delay_minutes} minutes`);
      const series = md.closes[sym];
      const missing = [], valid = [];
      for (let i = 0; i <= iEnd; i++) (Number.isNaN(series[i]) ? missing : valid).push(i);
      if (missing.length) add("warn", sym, "missing prices", `${missing.length} missing: ${fmt(missing.map(i => md.dates[i]))}. The signal skips any window that contains a gap.`);
      else add("ok", sym, "missing prices", "None");
      if (valid.length >= 2) {
        const jumps = [];
        for (let k = 1; k < valid.length; k++)
          if (Math.abs(Math.log(series[valid[k]]) - Math.log(series[valid[k - 1]])) > cfg.data.max_abs_daily_move) jumps.push(md.dates[valid[k]]);
        if (jumps.length) add("warn", sym, "big jumps", `Price moved more than ${(cfg.data.max_abs_daily_move * 100).toFixed(0)}% in a day on ${fmt(jumps)}. Check for stock splits or bad data.`);
        const last = md.dates[valid[valid.length - 1]];
        if (last !== asOf) add("warn", sym, "stale", `Last price is from ${last}, not ${asOf}`);
      }
    }
    if (today) {
      const age = daysBetween(asOf, today);
      if (age > cfg.data.max_staleness_days) add("warn", "data", "age", `Newest data is ${age} days old (${asOf}). Everything shown reflects that date, not today.`);
    }
    for (const sym of symbols) {
      if (!md.closes[sym]) continue;
      const chain = md.options.chain(sym, asOf);
      if (!chain.length) { add("error", `${sym} options`, "quotes", `No option prices on ${asOf}`); continue; }
      const noBid = chain.filter(q => !q.bid).length;
      const stamp = chain.map(q => q.as_of).sort().pop();
      const delays = new Set(chain.map(q => q.delay_minutes));
      const delay = delays.size === 1 && delays.has(null) && md.options_modeled ? "does not apply" : delays.has(null) ? "unknown" : `${Math.max(...delays)} min`;
      add("info", `${sym} options`, "snapshot", `${chain.length} option prices, time stamp ${stamp}, delay ${delay}, source ${chain[0].source}`);
      if (noBid) add("info", `${sym} options`, "no buyers", `${noBid} contracts have no bid (nobody is offering to buy them)`);
    }
    if (md.options_modeled) add("warn", "options", "calculated", "Option prices are calculated with a pricing model, not real market quotes");
    loadIssues.slice(0, 10).forEach(x => add("warn", "file", "dropped row", x));
    if (loadIssues.length > 10) add("warn", "file", "dropped rows", `${loadIssues.length - 10} more rows dropped`);
    const sel = cfg.data.universe_selected_as_of;
    if (!sel) add("warn", "pair", "hindsight", "You haven't recorded when you chose this pair. If you picked it after seeing it do well, test results will look better than reality.");
    else if (backtestStart && backtestStart < sel) add("warn", "pair", "hindsight", `The test starts ${backtestStart}, before you chose the pair (${sel}). Results before ${sel} use hindsight.`);
    const worst = items.reduce((w, i) => LEVELS[i.level] > LEVELS[w] ? i.level : w, "ok");
    return { asOf, items, worst };
  }

  // ---------------------------------------------------------------- signals
  function ols(y, x) {
    const n = y.length, xm = mean(x), ym = mean(y);
    let sxx = 0, sxy = 0;
    for (let i = 0; i < n; i++) { sxx += (x[i] - xm) ** 2; sxy += (x[i] - xm) * (y[i] - ym); }
    const beta = sxy / sxx, alpha = ym - beta * xm;
    const resid = y.map((v, i) => v - alpha - beta * x[i]);
    const s2 = sum(resid.map(r => r * r)) / Math.max(n - 2, 1);
    return { alpha, beta, resid, se: Math.sqrt(s2 / sxx) };
  }
  function dickeyFuller(resid) {
    const { beta: b, se } = ols(diff(resid), resid.slice(0, -1));
    return { t: se > 0 ? b / se : 0, halfLife: -1 < b && b < 0 ? -Math.log(2) / Math.log(1 + b) : Infinity };
  }
  function corr(a, b) {
    const ma = mean(a), mb = mean(b);
    let sab = 0, saa = 0, sbb = 0;
    for (let i = 0; i < a.length; i++) { sab += (a[i] - ma) * (b[i] - mb); saa += (a[i] - ma) ** 2; sbb += (b[i] - mb) ** 2; }
    return sab / Math.sqrt(saa * sbb);
  }
  function unavailable(t, d, reason) {
    return { index: t, date: d, alpha: NaN, beta: NaN, beta_se: NaN, spread: NaN, z: NaN, resid_std: NaN, correlation: NaN,
             adf_t: NaN, half_life: NaN, checks: [["data", false, reason]], eligible: false, reasons: [reason] };
  }
  function computeSignal(la, lb, t, cfg, d = null) {
    const L = cfg.lookback;
    if (t < L) return unavailable(t, d, `Need ${L} days of history, have ${t}`);
    const wa = Array.from(la.slice(t - L, t)), wb = Array.from(lb.slice(t - L, t));
    const gaps = wa.filter(Number.isNaN).length + wb.filter(Number.isNaN).length;
    if (gaps) return unavailable(t, d, `${gaps} missing prices in the ${L}-day window`);
    if (Number.isNaN(la[t]) || Number.isNaN(lb[t])) return unavailable(t, d, "Missing price on this date");
    const { alpha, beta, resid, se } = ols(wa, wb);
    const sd = std(resid);
    const spread = la[t] - alpha - beta * lb[t];
    const z = sd > 0 ? (spread - mean(resid)) / sd : NaN;
    const c = corr(diff(wa), diff(wb));
    const { t: adf, halfLife: hl } = dickeyFuller(resid);
    const checks = [
      ["correlation", c >= cfg.min_correlation, `Return correlation ${c.toFixed(2)} (need >= ${cfg.min_correlation.toFixed(2)})`],
      ["mean reversion", adf <= cfg.max_adf_t, `Dickey-Fuller t ${adf.toFixed(2)} (need <= ${cfg.max_adf_t.toFixed(2)})`],
      ["half-life", cfg.min_half_life <= hl && hl <= cfg.max_half_life, `Half-life ${hl.toFixed(1)} days (need ${cfg.min_half_life}-${cfg.max_half_life})`],
      ["hedge ratio", beta > 0, `Hedge ratio ${beta.toFixed(2)} (must be positive for a long-call/long-put pair)`],
    ];
    const eligible = checks.every(c => c[1]);
    return { index: t, date: d, alpha, beta, beta_se: se, spread, z, resid_std: sd, correlation: c, adf_t: adf, half_life: hl,
             checks, eligible, reasons: checks.filter(c => !c[1]).map(c => c[2]) };
  }
  const logs = arr => Float64Array.from(arr, v => Math.log(v));
  function signalSeries(md, pair, cfg) {
    const la = logs(md.closes[pair[0]]), lb = logs(md.closes[pair[1]]);
    return md.dates.map((d, t) => computeSignal(la, lb, t, cfg.signal, d));
  }

  // ---------------------------------------------------------------- costs (pessimistic fills)
  const MULT = 100;
  const slippage = (q, c) => c.slippage_spread_fraction * (qSpread(q) || 0) + c.slippage_fixed;
  const buyPrice = (q, c) => (q.ask == null || q.ask <= 0) ? null : q.ask + slippage(q, c);
  const sellPrice = (q, c) => (q.bid == null || q.bid <= 0) ? null : Math.max(q.bid - slippage(q, c), 0);
  const fees = (n, c) => n * (c.commission_per_contract + c.fees_per_contract);
  function roundTripCost(q, n, c) {
    const b = buyPrice(q, c); if (b == null) return null;
    return (b - (sellPrice(q, c) || 0)) * MULT * n + 2 * fees(n, c);
  }

  // ---------------------------------------------------------------- risk limits
  const drawdownOf = s => s.peak_equity <= 0 ? 0 : 1 - s.equity / s.peak_equity;
  function checkLiquidity(q, c) {
    if (q.bid == null || q.ask == null) return [`${qKey(q)}: no two-sided quote`];
    const out = [], sp = qSpreadPct(q);
    if (q.bid < c.min_bid) out.push(`${qKey(q)}: bid $${q.bid.toFixed(2)} below minimum $${c.min_bid.toFixed(2)}`);
    if (sp == null || sp > c.max_spread_pct) out.push(`${qKey(q)}: bid-ask spread ${sp == null ? "n/a" : (sp * 100).toFixed(1) + "%"} of mid exceeds ${(c.max_spread_pct * 100).toFixed(0)}%`);
    if (q.open_interest < c.min_open_interest) out.push(`${qKey(q)}: open interest ${q.open_interest} below ${c.min_open_interest}`);
    if (q.volume < c.min_volume) out.push(`${qKey(q)}: volume ${q.volume} below ${c.min_volume}`);
    return out;
  }
  function checkParticipation(q, n, c) {
    const out = [];
    if (q.volume <= 0 || n > c.max_volume_participation * q.volume)
      out.push(`${qKey(q)}: ${n} contracts is more than ${(c.max_volume_participation * 100).toFixed(0)}% of today's volume (${q.volume}); a real order would likely move the price`);
    if (q.open_interest <= 0 || n > c.max_oi_participation * q.open_interest)
      out.push(`${qKey(q)}: ${n} contracts is more than ${(c.max_oi_participation * 100).toFixed(0)}% of open interest (${q.open_interest})`);
    return out;
  }
  const maxLossBudget = (s, c) => Math.max(0, Math.min(c.max_loss_per_trade_pct * s.equity, c.max_total_premium_pct * s.equity - s.premium_at_risk));
  function checkPortfolio(s, newMaxLoss, counts, c) {
    const out = [], money0 = v => "$" + Math.round(v).toLocaleString("en-US");
    const dd = drawdownOf(s);
    if (dd >= c.kill_switch_drawdown_pct) out.push(`Kill switch: the account is down ${(dd * 100).toFixed(1)}% from its peak (limit ${(c.kill_switch_drawdown_pct * 100).toFixed(0)}%). No new trades until you review.`);
    if (s.open_trades >= c.max_open_trades) out.push(`Already ${s.open_trades} open trades (limit ${c.max_open_trades})`);
    const per = c.max_loss_per_trade_pct * s.equity;
    if (newMaxLoss > per + 1e-9) out.push(`Max loss ${money0(newMaxLoss)} exceeds the per-trade limit ${money0(per)} (${(c.max_loss_per_trade_pct * 100).toFixed(0)}% of the account)`);
    const cap = c.max_total_premium_pct * s.equity;
    if (s.premium_at_risk + newMaxLoss > cap + 1e-9) out.push(`Total money at risk would be ${money0(s.premium_at_risk + newMaxLoss)}, above ${money0(cap)} (${(c.max_total_premium_pct * 100).toFixed(0)}% of the account)`);
    for (const n of counts) {
      if (n > c.max_contracts_per_leg) out.push(`${n} contracts on one leg exceeds the limit of ${c.max_contracts_per_leg}`);
      if (n < 1) out.push("A leg has zero contracts");
    }
    return out;
  }

  // ---------------------------------------------------------------- strategy: signal -> proposal or rejection
  const directionText = (z, a, b) => z > 0 ? `${a} looks expensive compared with ${b}: buy puts on ${a}, buy calls on ${b}`
                                           : `${a} looks cheap compared with ${b}: buy calls on ${a}, buy puts on ${b}`;
  function expiryChoice(md, pair, d, cfg) {
    const ok = pair.map(sym => new Set(md.options.chain(sym, d).map(q => q.expiry)
      .filter(e => { const n = daysBetween(d, e); return cfg.options.min_dte <= n && n <= cfg.options.max_dte; })));
    const common = [...ok[0]].filter(e => ok[1].has(e)).sort();
    if (common.length) return { expiry: common[0], why: [] };
    const missing = pair.filter((s, i) => !ok[i].size);
    if (missing.length) return { expiry: null, why: missing.map(s => `No ${s} expiry between ${cfg.options.min_dte} and ${cfg.options.max_dte} days away`) };
    return { expiry: null, why: ["The two stocks have no common expiry date in the allowed range"] };
  }
  function atm(md, sym, d, expiry, right, spot) {
    const c = md.options.chain(sym, d).filter(q => q.expiry === expiry && q.right === right);
    if (!c.length) return null;
    return c.reduce((best, q) => {
      const a = Math.abs(q.strike - spot), b = Math.abs(best.strike - spot);
      return a < b || (a === b && q.strike < best.strike) ? q : best;
    });
  }
  function legValue(leg, spot, when, rate, ivMult = 1) {
    const t = Math.max(daysBetween(when, leg.quote.expiry), 0) / 365;
    return bsPrice(spot, leg.quote.strike, t, rate, (leg.quote.iv || 0) * ivMult, leg.right);
  }
  function scenarioPnl(p, ma, mb, when, rate, cfg, ivMult = 1, atExpiry = false) {
    let total = -p.premium - p.entry_fees;
    p.legs.forEach((leg, i) => {
      let v = legValue(leg, leg.spot * (1 + (i === 0 ? ma : mb)), when, rate, ivMult);
      if (!atExpiry) { v = Math.max(v - (qSpread(leg.quote) || 0) / 2 - slippage(leg.quote, cfg.costs), 0); total -= fees(leg.contracts, cfg.costs); }
      total += v * MULT * leg.contracts;
    });
    return total;
  }
  function addScenarios(p, rate, cfg) {
    const expiry = p.legs.map(l => l.quote.expiry).sort()[0];
    const h = addDays(p.quote_date, 14), horizon = h < addDays(expiry, -1) ? h : addDays(expiry, -1);
    const s = p.signal.spread, sd = p.signal.resid_std, beta = p.signal.beta, sign = p.signal.z > 0 ? 1 : -1;
    const ca = Math.exp(-s / 2) - 1, cb = Math.exp(s / (2 * beta)) - 1;
    const wa = Math.exp(sign * sd / 2) - 1, wb = Math.exp(-sign * sd / (2 * beta)) - 1;
    const rows = [
      ["Nothing moves (only time passes)", 0, 0, 1],
      ["The gap closes completely", ca, cb, 1],
      ["The gap widens further", wa, wb, 1],
      ["Both stocks rise 10%", 0.10, 0.10, 1],
      ["Both stocks fall 10%", -0.10, -0.10, 1],
      ["Option prices deflate 30% (volatility drop)", 0, 0, 0.7],
    ];
    const when = `in 14 days (${horizon})`;
    p.scenarios = rows.map(([name, a, b, iv]) => ({ name, when, move_a: a, move_b: b, iv_mult: iv, pnl: scenarioPnl(p, a, b, horizon, rate, cfg, iv) }));
    p.scenarios.push({ name: "The gap closes, but only at expiry", when: "at expiry", move_a: ca, move_b: cb, iv_mult: 1, pnl: scenarioPnl(p, ca, cb, expiry, rate, cfg, 1, true) });
    p.scenarios.push({ name: "Both options expire worthless (most you can lose)", when: "at expiry", move_a: NaN, move_b: NaN, iv_mult: 1, pnl: -p.max_loss });
    p.grid_moves = [-0.15, -0.10, -0.05, 0, 0.05, 0.10, 0.15];
    p.payoff_grid = p.grid_moves.map(ma => p.grid_moves.map(mb => scenarioPnl(p, ma, mb, expiry, rate, cfg, 1, true)));
  }
  const rejection = (date, stage, reasons, signal = null) => ({ type: "rejection", date, stage, reasons, signal });

  function propose(md, pair, signal, iq, state, cfg, entryZ = null) {
    const d = md.dates[iq];
    entryZ = entryZ == null ? cfg.signal.entry_z : entryZ;
    if (!signal.eligible) return rejection(d, "signal", signal.reasons, signal);
    if (Math.abs(signal.z) < entryZ) return rejection(d, "signal", [`|z| = ${Math.abs(signal.z).toFixed(2)} is inside the entry band (${entryZ}); the gap isn't unusual enough`], signal);
    const [a, b] = pair, spots = [mdClose(md, a, iq), mdClose(md, b, iq)];
    if (spots.includes(null)) return rejection(d, "contracts", ["Missing stock price on the quote date"], signal);
    const { expiry, why } = expiryChoice(md, pair, d, cfg);
    if (!expiry) return rejection(d, "contracts", why, signal);
    const rights = signal.z > 0 ? [PUT, CALL] : [CALL, PUT];
    const quotes = []; let reasons = [];
    pair.forEach((sym, i) => {
      const q = atm(md, sym, d, expiry, rights[i], spots[i]);
      if (!q) { reasons.push(`No ${sym} ${rights[i]} prices for ${expiry}`); return; }
      reasons = reasons.concat(checkLiquidity(q, cfg.liquidity));
      if (q.iv == null) reasons.push(`${qKey(q)}: no implied volatility (the price may be stale or wrong)`);
      quotes.push(q);
    });
    if (reasons.length) return rejection(d, "liquidity", reasons, signal);
    const tYears = daysBetween(d, expiry) / 365;
    const greeks = quotes.map((q, i) => bsGreeks(spots[i], q.strike, tYears, md.rate, q.iv, q.right));
    const prices = quotes.map(q => buyPrice(q, cfg.costs));
    const ddA = Math.abs(greeks[0].delta) * spots[0], ddB = Math.abs(greeks[1].delta) * spots[1];
    const per = prices.map(pr => pr * MULT + fees(1, cfg.costs));
    const budget = maxLossBudget(state, cfg.risk);
    let best = null;
    for (let nA = 1; nA <= cfg.risk.max_contracts_per_leg; nA++) {
      const target = signal.beta * nA * ddA, nB = Math.max(1, roundHalfEven(target / ddB));
      const cost = nA * per[0] + nB * per[1], mismatch = Math.abs(nB * ddB - target) / target;
      if (cost <= budget && nB <= cfg.risk.max_contracts_per_leg)
        if (!best || mismatch < best.mismatch || (mismatch === best.mismatch && cost < best.cost)) best = { nA, nB, mismatch, cost };
    }
    if (!best) return rejection(d, "sizing", [`Even 1 contract per leg risks $${Math.round(per[0] + per[1]).toLocaleString("en-US")}; the risk budget is $${Math.round(budget).toLocaleString("en-US")}`], signal);
    if (best.mismatch > cfg.options.max_hedge_mismatch)
      return rejection(d, "sizing", [`Whole-contract sizing (${best.nA}:${best.nB}) misses the hedge ratio by ${(best.mismatch * 100).toFixed(0)}% (limit ${(cfg.options.max_hedge_mismatch * 100).toFixed(0)}%) within the risk budget`], signal);
    const legs = pair.map((sym, i) => ({ symbol: sym, right: quotes[i].right, contracts: i ? best.nB : best.nA, quote: quotes[i],
                                          spot: spots[i], entry_price: prices[i], greeks: greeks[i] }));
    const premium = sum(legs.map(l => l.entry_price * MULT * l.contracts));
    const entryFees = fees(best.nA + best.nB, cfg.costs), maxLoss = premium + entryFees;
    reasons = legs.flatMap(l => checkParticipation(l.quote, l.contracts, cfg.liquidity))
      .concat(checkPortfolio(state, maxLoss, [best.nA, best.nB], cfg.risk));
    if (reasons.length) return rejection(d, "risk", reasons, signal);
    const id = crc32(`${pair}${d}${legs.map(l => qKey(l.quote))}${best.nA}${best.nB}`).toString(16).padStart(8, "0");
    const p = {
      type: "proposal", id, pair, signal, quote_date: d, direction: directionText(signal.z, a, b), legs, premium,
      entry_fees: entryFees, max_loss: maxLoss, round_trip_cost: sum(legs.map(l => roundTripCost(l.quote, l.contracts, cfg.costs))),
      target_ratio: signal.beta * ddA / ddB, hedge_mismatch: best.mismatch,
      net_delta_dollars: sum(legs.map(l => l.greeks.delta * l.spot * MULT * l.contracts)),
      net_theta_per_day: sum(legs.map(l => l.greeks.theta * MULT * l.contracts)),
      net_vega: sum(legs.map(l => l.greeks.vega * MULT * l.contracts)), flags: [],
    };
    addScenarios(p, md.rate, cfg);
    const lo = signal.beta - 2 * signal.beta_se, hi = signal.beta + 2 * signal.beta_se;
    p.flags.push(
      `The hedge ratio is an estimate: ${signal.beta.toFixed(2)}, plausibly anywhere from ${lo.toFixed(2)} to ${hi.toFixed(2)}`,
      "The two legs are balanced only on the day you enter; the balance drifts as prices move and time passes",
      `Time decay costs about $${Math.round(-p.net_theta_per_day)} per day if nothing moves`,
      "Earnings dates, dividends and company news are NOT checked. Check them yourself.");
    const conv = p.scenarios.find(s => s.name === "The gap closes completely");
    if (conv && conv.pnl < 0) p.flags.unshift(`Even if the gap closes completely within 14 days, this trade is estimated to lose about $${Math.round(-conv.pnl)} after time decay and costs. The odds are against it; many traders would skip it.`);
    if (md.options_modeled) p.flags.push("Option prices are calculated by a model, not real market quotes");
    if (p.round_trip_cost > 0.25 * maxLoss) p.flags.push(`Costs are large: getting in and straight back out would lose $${Math.round(p.round_trip_cost)} (${Math.round(p.round_trip_cost / maxLoss * 100)}% of the money at risk)`);
    return p;
  }

  // ---------------------------------------------------------------- backtest
  class Simulator {
    constructor(md, pair, cfg, sigCache) {
      Object.assign(this, { md, pair, cfg });
      this.la = logs(md.closes[pair[0]]); this.lb = logs(md.closes[pair[1]]);
      this.cash = cfg.risk.starting_equity; this.peak = this.cash;
      this.position = null; this.pendingEntry = null; this.pendingExit = null;
      this.equity = []; this.trades = []; this.rejections = []; this.premiumTraded = 0;
      this.sigs = sigCache || new Map();
    }
    signal(t) {
      if (!this.sigs.has(t)) this.sigs.set(t, computeSignal(this.la, this.lb, t, this.cfg.signal, this.md.dates[t]));
      return this.sigs.get(t);
    }
    currentEquity() { return this.cash + (this.position ? this.position.mark : 0); }
    run(t0, t1, entryZ) { for (let t = t0; t < t1; t++) this.step(t, entryZ); }
    step(t, entryZ) {
      const d = this.md.dates[t];
      if (this.position && this.pendingExit) this.tryExit(t, this.pendingExit);
      if (!this.position && this.pendingEntry) this.tryEnter(t);
      this.pendingEntry = null;
      if (this.position) this.settleExpired(t);
      if (this.position) this.mark(t);
      const eq = this.currentEquity();
      this.peak = Math.max(this.peak, eq);
      this.equity.push([t, eq]);
      const sig = this.signal(t);
      if (this.position) this.pendingExit = this.exitReason(t, sig);
      else if (!Number.isNaN(sig.z) && Math.abs(sig.z) >= entryZ) {
        if (sig.eligible) this.pendingEntry = [sig, entryZ];
        else this.rejections.push(rejection(d, "signal", sig.reasons, sig));
      }
    }
    exitReason(t, sig) {
      const pos = this.position, cfg = this.cfg, held = t - pos.entryIndex;
      const dte = Math.min(...pos.proposal.legs.map(l => daysBetween(this.md.dates[t], l.quote.expiry)));
      if (dte <= cfg.options.exit_dte) return `expiry approaching (${dte} days left)`;
      if (held >= cfg.signal.max_hold_days) return `time stop (${held} days)`;
      if (!Number.isNaN(sig.z)) {
        const side = pos.proposal.signal.z > 0 ? 1 : -1;
        if (side * sig.z <= cfg.signal.exit_z) return `gap closed (z ${sig.z >= 0 ? "+" : ""}${sig.z.toFixed(2)})`;
        if (Math.abs(sig.z) >= cfg.signal.stop_z) return `z stop (z ${sig.z >= 0 ? "+" : ""}${sig.z.toFixed(2)})`;
      }
      return null;
    }
    tryEnter(t) {
      const [sig, entryZ] = this.pendingEntry;
      const state = { equity: this.currentEquity(), peak_equity: this.peak, open_trades: 0, premium_at_risk: 0 };
      const r = propose(this.md, this.pair, sig, t, state, this.cfg, entryZ);
      if (r.type === "rejection") { this.rejections.push(r); return; }
      const spreadCost = sum(r.legs.map(l => (l.entry_price - qMid(l.quote)) * MULT * l.contracts));
      this.cash -= r.max_loss; this.premiumTraded += r.premium;
      this.position = { proposal: r, entryIndex: t, entryCost: r.max_loss, entryCosts: spreadCost + r.entry_fees, mark: 0, flags: [] };
    }
    legQuotes(t) {
      const d = this.md.dates[t];
      return this.position.proposal.legs.map(l => this.md.options.quote(l.symbol, d, l.quote.expiry, l.quote.strike, l.right));
    }
    mark(t) {
      const qs = this.legQuotes(t);
      if (qs.some(q => q == null)) { this.position.flags.push(`${this.md.dates[t]}: price missing, kept previous value`); return; }
      this.position.mark = sum(qs.map((q, i) => (q.bid || 0) * MULT * this.position.proposal.legs[i].contracts));
    }
    tryExit(t, reason) {
      const qs = this.legQuotes(t);
      if (qs.some(q => q == null)) { this.position.flags.push(`${this.md.dates[t]}: could not exit, price missing; retrying`); return; }
      let proceeds = 0, exitCosts = 0;
      const legs = this.position.proposal.legs;
      qs.forEach((q, i) => {
        let price = sellPrice(q, this.cfg.costs);
        if (price == null) { this.position.flags.push(`${qKey(q)} had no bid at exit; counted as worth $0`); price = 0; }
        proceeds += price * MULT * legs[i].contracts;
        exitCosts += ((qMid(q) || 0) - price) * MULT * legs[i].contracts;
      });
      const f = fees(sum(legs.map(l => l.contracts)), this.cfg.costs);
      this.close(t, reason, proceeds - f, exitCosts + f);
    }
    settleExpired(t) {
      const d = this.md.dates[t], legs = this.position.proposal.legs;
      if (legs.every(l => d < l.quote.expiry)) return;
      let value = 0;
      for (const l of legs) value += intrinsic(mdClose(this.md, l.symbol, t) || l.spot, l.quote.strike, l.right) * MULT * l.contracts;
      this.position.flags.push("Held to expiration: real in-the-money options turn into 100 shares per contract, which needs money you may not have");
      this.close(t, "expired", value, 0);
    }
    close(t, reason, exitValue, exitCosts) {
      const pos = this.position, p = pos.proposal;
      this.cash += exitValue; this.premiumTraded += Math.max(exitValue, 0);
      this.trades.push({ id: p.id, signal_date: p.signal.date, entry_date: this.md.dates[pos.entryIndex], exit_date: this.md.dates[t],
                         direction: p.direction, legs: p.legs.map(l => `${l.contracts}x ${qKey(l.quote)}`).join(", "), entry_z: p.signal.z,
                         exit_reason: reason, entry_cost: pos.entryCost, exit_value: exitValue, costs: pos.entryCosts + exitCosts,
                         pnl: exitValue - pos.entryCost, days_held: t - pos.entryIndex, flags: pos.flags });
      this.position = null; this.pendingExit = null;
    }
  }

  function drawdownStats(eq) {
    let peak = -Infinity, mdd = 0, longest = 0, cur = 0;
    for (const v of eq) {
      peak = Math.max(peak, v);
      const dd = 1 - v / peak;
      mdd = Math.max(mdd, dd);
      cur = dd > 1e-12 ? cur + 1 : 0; longest = Math.max(longest, cur);
    }
    return { mdd, longest };
  }
  function bootstrapMeanCi(values, samples, seed, level = 0.90) {
    if (values.length < 2) return null;
    const rng = mulberry32(seed), means = new Array(samples);
    for (let s = 0; s < samples; s++) { let acc = 0; for (let k = 0; k < values.length; k++) acc += values[Math.floor(rng() * values.length)]; means[s] = acc / values.length; }
    const tail = (1 - level) / 2 * 100;
    return [percentile(means, tail), percentile(means, 100 - tail)];
  }
  function computeMetrics(eq, pnls, totalCosts, premiumTraded, samples, seed) {
    const rets = eq.length > 1 ? eq.slice(1).map((v, i) => v / eq[i] - 1) : [0];
    const days = eq.length, total = eq[eq.length - 1] / eq[0] - 1, years = Math.max(days / 252, 1e-9);
    const { mdd, longest } = drawdownStats(eq);
    const cutoff = percentile(rets, 5), wins = pnls.filter(p => p > 0), losses = pnls.filter(p => p <= 0), net = sum(pnls);
    return {
      days, total_return: total, annualized_return: total > -1 ? (1 + total) ** (1 / years) - 1 : -1,
      annualized_vol: rets.length > 1 ? std(rets) * Math.sqrt(252) : 0,
      sharpe_rough: rets.length > 1 && std(rets, 0) > 0 ? mean(rets) / std(rets) * Math.sqrt(252) : 0,
      max_drawdown: mdd, max_drawdown_days: longest, worst_day: Math.min(...rets), cvar_5: mean(rets.filter(r => r <= cutoff)),
      trades: pnls.length, win_rate: pnls.length ? wins.length / pnls.length : 0,
      avg_win: wins.length ? mean(wins) : 0, avg_loss: losses.length ? mean(losses) : 0,
      worst_trade: pnls.length ? Math.min(...pnls) : 0, best_trade: pnls.length ? Math.max(...pnls) : 0,
      mean_trade_pnl: pnls.length ? mean(pnls) : 0, mean_trade_ci90: bootstrapMeanCi(pnls, samples, seed),
      total_costs: totalCosts, gross_pnl: net + totalCosts, net_pnl: net, turnover_annual: premiumTraded / mean(eq) / years,
    };
  }

  function walkForward(md, pair, cfg) {
    const wf = cfg.walk_forward, n = md.dates.length, L = cfg.signal.lookback;
    if (n < L + wf.train_days + wf.test_days)
      throw new Error(`The test needs at least ${L + wf.train_days + wf.test_days} days of data; there are ${n}.`);
    const cache = new Map(), oos = new Simulator(md, pair, cfg, cache), windows = [];
    for (let s = L; s + wf.train_days < n; s += wf.test_days) {
      const tr0 = s, tr1 = s + wf.train_days, te0 = tr1, te1 = Math.min(tr1 + wf.test_days, n);
      const scores = [];
      for (const z of cfg.signal.entry_z_grid) {
        const sim = new Simulator(md, pair, cfg, cache);
        sim.run(tr0, tr1, z);
        const eq = sim.equity.map(e => e[1]);
        scores.push({ z, ret: eq[eq.length - 1] / eq[0] - 1, dd: drawdownStats(eq).mdd, trades: sim.trades.length });
      }
      let chosen = null, bestScore = -Infinity;
      for (const sc of scores) if (sc.trades >= wf.min_train_trades) { const v = sc.ret / Math.max(sc.dd, 0.02); if (v > bestScore) { bestScore = v; chosen = sc.z; } }
      const choseDefault = chosen == null; if (choseDefault) chosen = cfg.signal.entry_z;
      const startEq = oos.currentEquity(), nTrades = oos.trades.length;
      oos.run(te0, te1, chosen);
      const isScore = scores.find(sc => sc.z === chosen);
      windows.push({ train: [md.dates[tr0], md.dates[tr1 - 1]], test: [md.dates[te0], md.dates[te1 - 1]], scores, chosen_z: chosen,
                     chose_default: choseDefault, in_sample_return: isScore ? isScore.ret : NaN,
                     oos_return: oos.currentEquity() / startEq - 1, oos_trades: oos.trades.length - nTrades });
    }
    const equity = oos.equity.map(e => e[1]);
    const m = computeMetrics(equity, oos.trades.map(t => t.pnl), sum(oos.trades.map(t => t.costs)), oos.premiumTraded, wf.bootstrap_samples, wf.seed);
    const warnings = [
      "Past and simulated results do not predict future performance.",
      `${cfg.signal.entry_z_grid.length} entry thresholds were tried in every training period. Trying more settings makes past results look better and future results less trustworthy.`,
    ];
    if (md.options_modeled) warnings.push("Option prices in this test are calculated by a model, not historical market quotes. Real prices, spreads and volatility will differ.");
    if (Object.values(md.meta).some(x => x.synthetic)) warnings.push("The stock prices are made up (practice data). These results only show that the tool works, not that the strategy does.");
    if (m.trades < 30) warnings.push(`Only ${m.trades} test trades. That is far too few to judge whether the strategy works.`);
    if (m.mean_trade_ci90 && m.mean_trade_ci90[0] <= 0 && 0 <= m.mean_trade_ci90[1])
      warnings.push("The likely range for the average trade includes zero, so these results can't be told apart from luck.");
    return { pair, windows, equity_dates: oos.equity.map(e => md.dates[e[0]]), equity, trades: oos.trades,
             open_trade: oos.position ? `${oos.position.proposal.id} was still open at the end; it is counted at what it could be sold for` : null,
             rejections: oos.rejections, metrics: m, configs_tried: cfg.signal.entry_z_grid.length * windows.length, warnings };
  }

  // ---------------------------------------------------------------- historical precedent (mirrors statarb/precedent.py)
  function findDrifts(md, pair, cfg) {
    const c = cfg.signal, la = logs(md.closes[pair[0]]), lb = logs(md.closes[pair[1]]), n = md.dates.length, out = [];
    let cur = null;
    for (let t = c.lookback; t < n; t++) {
      const s = computeSignal(la, lb, t, c, md.dates[t]);
      if (Number.isNaN(s.z)) continue;
      if (!cur) {
        if (s.eligible && Math.abs(s.z) >= c.entry_z) cur = { start_index: t, start: md.dates[t], end: null, side: s.z > 0 ? 1 : -1, entry_z: s.z, peak_z: s.z, outcome: "open", days: 0, pnl: null };
        continue;
      }
      cur.days = t - cur.start_index;
      if ((s.z > 0) === (cur.side > 0) && Math.abs(s.z) > Math.abs(cur.peak_z)) cur.peak_z = s.z;
      if (cur.side * s.z <= c.exit_z) { cur.end = md.dates[t]; cur.outcome = "closed"; out.push(cur); cur = null; }
